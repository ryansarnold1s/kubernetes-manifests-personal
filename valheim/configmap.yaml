# Non-secret env for the indifferentbroccoli/valheim-server-docker image. Names are the
# image's, read from scripts/start.sh and scripts/init.sh at commit cc29666 -- the README
# documents most of them but the scripts are the truth (see PUBLIC below).
apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-config
  namespace: valheim
  labels:
    app: valheim
data:
  SERVER_NAME: "Deathsquito Support Group"
  # Fresh world for 1.0. The previous world (TreeFellMeFirst) was deleted with its PVC on
  # 2026-09-10 by decision; there is no copy.
  WORLD_NAME: "TreeFellMeAgain"
  PORT: "2456"
  TZ: "America/Phoenix"
  # false = Steam networking only, which is what "Join IP" over the LAN expects. true would
  # route through PlayFab, add latency, and make the server show up for crossplay clients.
  CROSSPLAY_ENABLED: "false"
  # ⚠️ Dead code in this image: start.sh tests ${PUBLIC_ENABLED}, which nothing sets, so
  # -public is ALWAYS 0 whatever this says. Kept so the intent is visible; if upstream ever
  # fixes the variable name this is already the value we want.
  PUBLIC: "false"
  # Stock 1800s. The old server ran 3600 because a 60MB world froze for 3s per save; an empty
  # world does not, so the tradeoff (up to 60 min lost on a crash) is not worth taking yet.
  # Revisit with the same measurement once the world grows: time the gap between two
  # "World saved" lines, and the ms figure on each.
  SAVE_INTERVAL: "1800"
  # Pinned although the image's Dockerfile ENV already sets it, because it is load-bearing:
  # start.sh passes -savedir "${SAVE_DIR}", and three other places hardcode the same path --
  # the valheim-data mountPath in deployment.yaml (both containers), SAVES in the fetch-mods
  # script in mods-configmap.yaml (where adminlist.txt is written), and the image's init.sh
  # (chown -R /valheim-saves). Change this alone and the world is written to the container's
  # ephemeral filesystem, off the PVC, and lost on the next restart, while adminlist.txt
  # lands where the game never reads it. Change all of them together or none.
  SAVE_DIR: "/valheim-saves"
  # Valheim's native rolling backups in worlds_local/, stated explicitly rather than trusted
  # to image defaults: one at 2h then three 12h apart. These are the ONLY in-app backups on
  # this image -- there is no cron and no zip. Longhorn snapshots and CloudCasa cover the rest.
  KEEP_BACKUPS: "4"
  BACKUPS_SHORT: "7200"
  BACKUPS_LONG: "43200"
  # Plain Normal preset, no MODIFIER_* keys: this world starts unmodified. The old
  # "-modifier resources more" was deliberately not carried over.
  SERVER_PRESET: "Normal"
  # -setkey nobuildcost. ⚠️ -setkey persists a global key INTO THE WORLD SAVE. Setting this
  # back to false removes the arg but NOT the key; reversal is an admin running
  # `removekey nobuildcost` in the in-game F5 console, then restarting so the arg is gone too.
  NO_BUILD_COST: "true"
  # The other -setkey toggles, pinned so an upstream default change cannot flip them.
  NO_MAP: "false"
  PLAYER_EVENTS: "false"
  PASSIVE_MOBS: "false"
  FIRE_HAZARDS: "false"
  # true makes start.sh export the doorstop/LD_PRELOAD env that loads BepInEx. The pack ITSELF
  # is installed by the fetch-mods initContainer (see mods-configmap.yaml for why the image
  # must not do it). Do not set the image's MODS variable: its downloader re-fetches
  # everything unverified on every boot and flattens every zip into one directory.
  BEPINEX_ENABLED: "true"
  # Inert while the initContainer installs the pack (the image only reads this on ITS OWN
  # first install), but pinned to the version in mods-configmap.yaml so the two never disagree.
  BEPINEXPACK_VERSION: "5.4.2350"
  # false = SteamCMD runs only when /valheim/valheim_server.x86_64 is absent. Game updates are
  # deliberate on this server because a Valheim patch routinely breaks BepInEx mods -- this is
  # exactly how the previous server got stuck on a pre-1.0 build with 1.0 clients locked out,
  # so when an update IS wanted: set this to "true", apply, rollout restart, verify the mods,
  # set it back. (Deleting the valheim-server PVC forces the same thing the hard way.)
  UPDATE_ON_START: "false"
  BETA: "public"
  # Required by init.sh, which exits without them. It usermods the steam user to these ids
  # and chown -Rs both volumes -- and then runs the game as root regardless (there is no su
  # in the image despite the comment saying "PID of su"). The ids themselves are arbitrary --
  # both PVCs are new and the game runs as root -- but they must be set, or init.sh exits.
  PUID: "10000"
  PGID: "10000"
  # Space-separated SteamID64s. Consumed by the fetch-mods initContainer, which rewrites
  # /valheim-saves/adminlist.txt every boot -- the image itself does nothing with admins.
  # Edit here, apply, rollout restart. Admin grants the F5 console kick/ban/save/removekey
  # commands; it does not enable cheats.
  # 76561197963378853 = Ryan, captured from the server's own "Got connection SteamID" line.
  ADMINLIST_IDS: "76561197963378853"
  # Deliberately absent:
  #   MODS        -- see BEPINEX_ENABLED above
  #   MAX_PLAYERS -- any value other than 10 makes start.sh silently install its bundled
  #                  MaxPlayerCount mod into BepInEx/plugins/
  #   MODIFIER_*  -- see SERVER_PRESET
