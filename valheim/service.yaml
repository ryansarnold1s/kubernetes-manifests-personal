apiVersion: v1
kind: Service
metadata:
  name: valheim
  namespace: valheim
  labels:
    app: valheim
  annotations:
    # metallb.io/ is the current domain. The old metallb.universe.tf/ prefix still works on
    # MetalLB v0.16.1 but logs a deprecatedAnnotation warning on every reconcile.
    metallb.io/loadBalancerIPs: 192.168.130.155
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - name: game
    port: 2456
    targetPort: 2456
    protocol: UDP
  - name: query
    port: 2457
    targetPort: 2457
    protocol: UDP
  selector:
    app: valheim
