apiVersion: v1
kind: Service
metadata:
  name: valheim
  namespace: valheim
  labels:
    app: valheim
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.130.155
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - name: game
    port: 2456
    targetPort: 2456
    protocol: UDP
  - name: query
    port: 2457
    targetPort: 2457
    protocol: UDP
  selector:
    app: valheim
