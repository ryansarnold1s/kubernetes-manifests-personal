    Searica.Valheim.SkilledCarryWeight.cfg|Farming|Enabled|true
    Searica.Valheim.SkilledCarryWeight.cfg|Farming|Coefficient|0.5
    Searica.Valheim.SkilledCarryWeight.cfg|Fishing|Enabled|true
    Searica.Valheim.SkilledCarryWeight.cfg|Fishing|Coefficient|0.5
    Searica.Valheim.SkilledCarryWeight.cfg|Jump|Enabled|true
    Searica.Valheim.SkilledCarryWeight.cfg|Jump|Coefficient|0.5
    Searica.Valheim.SkilledCarryWeight.cfg|Knives|Enabled|true
    Searica.Valheim.SkilledCarryWeight.cfg|Knives|Coefficient|0.5
    Searica.Valheim.SkilledCarryWeight.cfg|Pickaxes|Enabled|true
