    # Time: night is SHORTER than vanilla but no longer drastically so. nightPercent is the share
    # of the whole day cycle that is night ("0 is all daytime, 100 is all nighttime", default 30).
    # ⚠️ ABSOLUTE, NOT A MODIFIER -- 23 means "night is 23% of the cycle", not "+23%".
    #
    # totalDayTimeInSeconds is 1800 and is NOT pinned, so the arithmetic is:
    #   30 -> 9 min night / 21 min day   (vanilla)
    #   23 -> 6m54s night / 23m06s day   (current)
    #   10 -> 3 min night / 27 min day   (previous)
    #
    # ⚠️ INTEGER FIELD. V+ serialises float settings with an explicit decimal point --
    # defaultFOV = 65.0, forcePartOfDayTime = 0.5, Kiln productionSpeed = 7.5 -- and writes
    # nightPercent as a bare "10". A fractional value here truncates. That is why this is 23 and
    # not 23.33: 7m00s of night is not reachable at totalDayTimeInSeconds 1800 with an integer
    # percent. Hitting exactly 7 min would need totalDayTimeInSeconds 1680 with nightPercent 25 --
    # which shortens the whole cycle and, per the setting's own note, "may change time of day once
    # after activation" on an existing world. Not worth six seconds.
    #
    # The total cycle is fixed at 1800s, so lengthening night SHORTENS day by the same amount.
    # Deliberately not 0 -- night still needs to exist for night-spawning mobs, light sources and
    # sleeping to remain meaningful.
    #
    # The other three keys are pinned at the values V+ 9.17.1 already ships, so they are a
    # behavioural no-op TODAY. They are here because [Time] is ENABLED, which makes every key in
    # the section live -- the same reason baseMegingjordBuff is pinned at its vanilla 150 in
    # [Player]. Unpinned, a future V+ release changing one of these defaults would silently
    # alter day length or freeze the clock, and MOD_CONFIG would not be the source of truth it
    # claims to be. All four keys in [Time] are now accounted for.
    #
    # ⚠️ totalDayTimeInSeconds is the DENOMINATOR for nightPercent. Changing it silently
    # rescales night: at nightPercent 23, 1800 -> 6m54s but 3600 -> 13m48s. Its own note warns
    # it "may change time of day once after activation" on an existing world, so it is not a
    # free dial -- change it only in a window, and recompute the night arithmetic above.
    #
    # forcePartOfDay freezes the clock at forcePartOfDayTime (0 = midnight, 0.5 = midday) and
    # DISABLES every other setting in this section, nightPercent included. It stays false.
    valheim_plus.cfg|Time|enabled|true
    valheim_plus.cfg|Time|nightPercent|23
    valheim_plus.cfg|Time|totalDayTimeInSeconds|1800
    valheim_plus.cfg|Time|forcePartOfDay|false
    valheim_plus.cfg|Time|forcePartOfDayTime|0.5
