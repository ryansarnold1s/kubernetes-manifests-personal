# BepInEx framework, server-side mods, and per-mod config, applied by the `fetch-mods`
# initContainer in deployment.yaml straight into the live install on the valheim-server PVC.
#
# WHY AN INIT CONTAINER: Kubernetes has no bind-mount for a workstation file, so a DLL has to
# reach the PVC somehow. The pod has outbound internet, so fetching pinned, checksummed
# releases at pod start is declarative and reproducible from an empty PVC.
#
# WHY THE INIT CONTAINER INSTALLS BEPINEXPACK TOO (and not the image): the image downloads
# BepInExPack only when /valheim/BepInEx is ABSENT. This container has to create
# BepInEx/plugins/<mod>/ before the game container's first boot, so the image would see the
# directory, skip its own install, and the game would boot vanilla with no error. Owning the
# pack also owns /valheim/.bepinex_version, which the image's start.sh reads to choose the
# doorstop env var names -- no marker means "legacy 5.4.22", the old names, and BepInEx never
# loads. So: BEPINEX_ENABLED=true in configmap.yaml (for the LD_PRELOAD/doorstop env), the
# pack from here, and the image's own MODS variable left unset. Its downloader still RUNS on
# every boot -- start.sh calls install_mods whenever BEPINEX_ENABLED=true -- but with MODS
# unset all it does is `rm -rf` and recreate an empty BepInEx/plugins/thunderstore/. That
# directory belongs to the image; the prune in install-mods.sh leaves it alone.
#
# ADDING/UPGRADING: add or edit a line in MODS, then apply + rollout restart. The installer
# keys off "<version> <sha256>", so changing either reinstalls just that entry. Checksum:
#   kubectl exec -n valheim deploy/valheim -c valheim -- sh -c 'curl -fsSL -o /tmp/m.zip "<url>" && sha256sum /tmp/m.zip'
#
# REMOVING: delete the line, apply, restart. Any plugins/<dir> not named in MODS is pruned,
# with a breaker that refuses more than 2 removals in one boot (a truncated MODS block looks
# exactly like a mass removal). Only mods that register no prefabs are free to remove --
# a mod that added items or creatures leaves orphaned ZDOs in the world save.
#
# The first install of any NEW mod costs two applies: a mod does not write its .cfg until
# it has booted once, and MOD_CONFIG cannot name a section that does not exist yet.
apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-mods
  namespace: valheim
  labels:
    app: valheim
data:
  # name  version  url  sha256  layout
  #
  # layout=pack    -> BepInExPack_Valheim/* is copied over /valheim (the framework itself)
  # layout=plugins -> the zip has a plugins/ dir; its contents go to BepInEx/plugins/<name>/
  # layout=bepinex -> the zip nests under BepInEx/plugins/ (ValheimPlus does this)
  # layout=root    -> the .dll sits at the zip root; it goes to BepInEx/plugins/<name>/
  #
  # Checksums captured from the real downloads on 2026-09-10. Layouts verified with unzip -l,
  # not assumed from the store page.
  #
  # ValheimPlus 10.1.0 declares BepInExPack 5.4.2350; Jotunn 2.30.0 declares 5.4.2333, which
  # 5.4.2350 satisfies. All three shipped Valheim 1.0 releases on 2026-09-09/10.
  #
  # CLIENT INSTALL: every client needs BepInExPack 5.4.2350 and ValheimPlus 10.1.0. MOD_CONFIG
  # pins V+'s [Server] section with enforceMod = true, so a client without the same V+ version
  # is REFUSED, and serverSyncsConfig = true, which pushes this server's V+ config to clients.
  # Both are also V+ 10.0.2's own defaults (verified 2026-09-10 from the V+ source, tag
  # 0.10.0.2, ServerConfiguration.cs). To allow mod-free joining instead, change the
  # [Server] enforceMod pin in MOD_CONFIG to false.
  # Install Jotunn 2.30.0 on clients too, to match.
  MODS: |
    BepInExPack_Valheim  5.4.2350  https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2350/               37a91c000b4e88f2ed7a4bd7d812239852d2e36cbf0ff0a9f5faacfba46b105f  pack
    Jotunn               2.30.0    https://thunderstore.io/package/download/ValheimModding/Jotunn/2.30.0/                        f7f218ac3f97b27a7e65d62b5ebe7c29b93129bf3e56cf41b6870bef1ef161fd  plugins
    ValheimPlus          10.1.0    https://thunderstore.io/package/download/Grantapher/ValheimPlus_Grantapher_Temporary/10.1.0/  8f9c59ff4f324b0ac6119e25b32859b27214f9892f7e95ca118c1127dbd4709a  bepinex
  # Per-mod config, declared here instead of hand-edited on the PVC. One line per key:
  #   <file under BepInEx/config>|<section>|<key>|<value>
  #
  # One parser. ValheimPlus >= 10 is BepInEx-bound like every other mod here: its config is
  # org.bepinex.plugins.valheim_plus.cfg ("Key = Value", `# Setting type:` headers), created
  # by V+ on its first boot. The applier preserves whichever separator style a file uses.
  #
  # ⚠️ NEVER name valheim_plus.cfg on a line here. That is the LEGACY (V+ <= 9.x) INI file,
  # and set_cfg creates any file it is pointed at. V+ 10 treats a valheim_plus.cfg found
  # beside its BepInEx config as an override that wins on every launch, makes settings
  # read-only in-game, and logs a deprecation warning (V+ BepInExConfig.cs at tag 0.10.0.2,
  # LegacyMode.Override).
  #
  # A rejected BepInEx value logs "could not be parsed" in the game container. Whether a
  # rejected V+ 10 value does too is still UNVERIFIED -- the rebuild's Task 6 only tested
  # accepted values -- so verify V+ pins by reading them back off the PVC with
  # valheim/tests/verify-vp-config.sh, never by the absence of that line.
  #
  # ⚠️ Enabling a V+ section makes EVERY key in it live. Pin them all, including the ones
  # staying at default, or a future V+ default change takes effect silently.
  #
  # ⚠️ A pin whose value equals the mod's default is inert and unverifiable -- it reads back
  # correct even if the section name is wrong. [Fermenter] is the designated sentinel: its
  # restored values (duration 1200, 12 items, auto-deposit and auto-fuel on) all differ from
  # V+ 10.0.2's defaults, so reading them back proves the applier reached this file.
  #
  # The V+ tuning below is the pre-1.0 server's, restored 2026-09-10 at the operator's request
  # ("restore all as before"). All 184 of its pins carried over unchanged -- every section, key
  # and value type still exists in V+ 10.0.2 -- plus the 86 keys it never pinned in those
  # enabled sections, pinned at their 10.0.2 generated defaults. Keys and defaults were read
  # from the live file V+ 10.0.2 generated on first boot, not from docs.
  # [Server] is pinned as well, all 5 keys at their 10.0.2 defaults: it is the one section V+
  # keeps on by default, and its keys govern mod enforcement, config push and the player cap.
  #
  # Behaviour changes from the V+ 0.10.0.0 release notes: Building.noWeatherDamage now covers
  # rain and water erosion only, per its own help text; 1.0 added other weather damage it does
  # not block. StructuralIntegrity gained ice and timberwood for 1.0's materials, inert while
  # disableStructuralIntegrity = true.
  # [Inventory] and [Wagon] stay off as before. The mods they used to collide with
  # (AzuExtendedPlayerInventory, AzuContainerSizes, OdinHorse) are gone, so enabling either
  # is now a free choice -- enumerate and pin every key in the section if you do.
  #
  # To change a value: edit it here, apply, rollout restart, then read EVERY key back off the
  # PVC with valheim/tests/verify-vp-config.sh. V+ pushes this config to clients on connect.
  MOD_CONFIG: |
    # --- ValheimPlus: pre-1.0 tuning restored 2026-09-10; every key of every enabled section --
    # --- is pinned. Generated from the old pins + the live 10.0.2 file.                     --

    # [Server] -- the one V+ section that is ON by default (enabled defaults to true), so it is
    # live whether or not anything here names it. Pinned at its 10.0.2 defaults so a future V+
    # default change cannot silently flip mod enforcement, config push or the player cap.
    # enforceMod = true is the operator's decision (clients need the same V+ version);
    # maxPlayers 10 matches the image, whose MAX_PLAYERS is deliberately unset.
    org.bepinex.plugins.valheim_plus.cfg|Server|enabled|true
    org.bepinex.plugins.valheim_plus.cfg|Server|maxPlayers|10
    org.bepinex.plugins.valheim_plus.cfg|Server|disableServerPassword|false
    org.bepinex.plugins.valheim_plus.cfg|Server|enforceMod|true
    org.bepinex.plugins.valheim_plus.cfg|Server|serverSyncsConfig|true

    # [Inventory] off, as on the pre-1.0 server (only enabled is pinned; a disabled section reads no other key)
    org.bepinex.plugins.valheim_plus.cfg|Inventory|enabled|false

    # [Wagon] off, as on the pre-1.0 server (only enabled is pinned; a disabled section reads no other key)
    org.bepinex.plugins.valheim_plus.cfg|Wagon|enabled|false

    # [Player]
    org.bepinex.plugins.valheim_plus.cfg|Player|enabled|true
    org.bepinex.plugins.valheim_plus.cfg|Player|baseMaximumWeight|850
    org.bepinex.plugins.valheim_plus.cfg|Player|baseMegingjordBuff|150
    org.bepinex.plugins.valheim_plus.cfg|Player|baseAutoPickUpRange|2
    org.bepinex.plugins.valheim_plus.cfg|Player|disableCameraShake|false
    org.bepinex.plugins.valheim_plus.cfg|Player|baseUnarmedDamage|70
    org.bepinex.plugins.valheim_plus.cfg|Player|cropNotifier|false
    org.bepinex.plugins.valheim_plus.cfg|Player|restSecondsPerComfortLevel|60
    org.bepinex.plugins.valheim_plus.cfg|Player|deathPenaltyMultiplier|-100
    org.bepinex.plugins.valheim_plus.cfg|Player|autoRepair|true
    org.bepinex.plugins.valheim_plus.cfg|Player|guardianBuffDuration|300
    org.bepinex.plugins.valheim_plus.cfg|Player|guardianBuffCooldown|1200
    org.bepinex.plugins.valheim_plus.cfg|Player|disableGuardianBuffAnimation|false
