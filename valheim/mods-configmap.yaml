# Server-side BepInEx mod set and per-mod config, applied by the `fetch-mods` initContainer
# in deployment.yaml.
#
# WHY AN INIT CONTAINER: Kubernetes has no bind-mount equivalent for a workstation file, so a
# DLL has to reach the valheim-data PVC somehow. The pod has outbound internet (verified:
# thunderstore.io -> HTTP 200), so fetching pinned releases at pod start is declarative,
# reproducible from an empty PVC, and keeps versions in git instead of in someone's memory.
#
# ADDING/UPGRADING A MOD: add or edit a line in MODS below, then apply + rollout restart. The
# installer keys off "<version> <sha256>", so changing either triggers a clean reinstall of just
# that mod. Get a new checksum with:
#   kubectl exec -n valheim deploy/valheim -c valheim -- sh -c 'curl -fsSL -o /tmp/m.zip "<url>" && sha256sum /tmp/m.zip'
#
# REMOVING A MOD: delete the line, apply, restart. The installer prunes any plugin directory not
# listed in MODS from BOTH the staged copy here and the live install at
# /opt/valheim/bepinex/BepInEx/plugins, and drops its .mod-state marker. This used to require a
# manual rm -rf in two places, because the image syncs with `rsync -a` and no --delete.
#
# Deleting the valheim-server PVC does NOT remove a mod, despite being the disposable one -- the
# staged copy here survives and the bootstrap rsync restores it.
#
# ⚠️ The prune handles FILES, not world data. A mod that registered prefabs -- EpicLoot, Warfare,
# Armory, OdinsFoodBarrels, OdinHorse -- has its items or creatures persisted as ZDOs in the world
# save, and dropping it orphans them. Only pure runtime-patch mods are free to remove.
apiVersion: v1
kind: ConfigMap
metadata:
  name: valheim-mods
  namespace: valheim
  labels:
    app: valheim
data:
  # name  version  url  sha256  layout
  #
  # layout=plugins -> the zip has a plugins/ dir; its contents go to BepInEx/plugins/<name>/
  # layout=bepinex -> the zip nests under BepInEx/plugins/ (ValheimPlus does this)
  # layout=root    -> the .dll sits at the zip root; it goes to BepInEx/plugins/<name>/
  #
  # A zip's optional config/ dir is always copied to /config/bepinex/ , which IS
  # BepInEx/config/ (the live install symlinks it). Only Warfare ships one -- its
  # TherzieTranslations YAMLs. Verified against each zip's actual contents, not assumed.
  #
  # Checksums captured from the real downloads (2026-07-27).
  # CLIENT INSTALL: every mod here except PlantEverything must also be on each client.
  # AzuExtendedPlayerInventory and AzuContainerSizes actively KICK clients that lack them.
  # See README.md for the full client list.
  MODS: |
    Jotunn                     2.29.2   https://thunderstore.io/package/download/ValheimModding/Jotunn/2.29.2/                      c018eb5876ea0b4a509c32b7926055918ea95bc4698610df6b2acc58d72029ad  plugins
    JsonDotNET                 13.0.4   https://thunderstore.io/package/download/ValheimModding/JsonDotNET/13.0.4/                  a221c7be7163ab9739274b962fbd1f63abde65b1418839a62f02aca210868147  plugins
    EpicLoot                   0.12.15  https://thunderstore.io/package/download/RandyKnapp/EpicLoot/0.12.15/                       0b13feefd8b23df985505f6b9fba6fcd71bcdff1c33935e03bf1c84378bba5eb  plugins
    AzuExtendedPlayerInventory 2.4.1    https://thunderstore.io/package/download/Azumatt/AzuExtendedPlayerInventory/2.4.1/          813b4310b571ddc4465cc9b9d627b137410c6027088e5516ac299b4c5febb2be  root
    Warfare                    1.8.9    https://thunderstore.io/package/download/Therzie/Warfare/1.8.9/                             bd591233da37ba3be3d2edcb5745df154f18fab91fb3da434e647b3f1c49a405  root
    PlantEverything            1.20.0   https://thunderstore.io/package/download/Advize/PlantEverything/1.20.0/                     cbea097f4d8ac6bd7020d6c76a98f271ef8ae5a3e405ae64e110ed15c2941fe6  root
    AzuContainerSizes          1.1.4    https://thunderstore.io/package/download/Azumatt/AzuContainerSizes/1.1.4/                   801dfcd3cea2d37a009780a6fe6fb8091414fd36bd84678bd17fd06bb51c9112  root
    ValheimPlus                9.17.1   https://thunderstore.io/package/download/Grantapher/ValheimPlus_Grantapher_Temporary/9.17.1/ 51974dc21c1a2414bb966f7fc8b043ee13c5b95dddc0b678e11edc5c44d91484  bepinex
    Armory                     1.3.1    https://thunderstore.io/package/download/Therzie/Armory/1.3.1/                             8be5e52c400dc27975dcbcb8d870b762df67932b2161b2c44184958b8acbb5ce  root
    OdinsFoodBarrels           1.2.3    https://thunderstore.io/package/download/OdinPlus/OdinsFoodBarrels/1.2.3/                  0f451a6f634c17e698ad592979be98f710283eeb235f732cbf4200496ef6e3f6  root
    XPortal                    1.2.24   https://thunderstore.io/package/download/SpikeHimself/XPortal/1.2.24/                      ba141d8c0dba3e102d83c54665a5a938abb2fcbe90b5197a127fdd74d976150a  plugins
    # OdinHorse: rideable/tameable/breedable horses plus a horse cart. Pinned at 1.6.5 rather
    # than an older "more proven" release because 1.6.2 was the server-side fix ("error when
    # using Mod on Server. Any array-typed config, fixed at the ServerSync.cs layer") -- anything
    # before that is actively wrong for a dedicated server. Everything since is cosmetic.
    #
    # Saddle storage ships DISABLED by default for performance and is deliberately left that way.
    # Turning it on needs a second apply: MOD_CONFIG needs exact section/key names, and those do
    # not exist until the mod generates its .cfg on first boot.
    #
    # ⚠️ Requires the [Wagon] pin in MOD_CONFIG to stay disabled -- see the note there.
    OdinHorse                  1.6.5    https://thunderstore.io/package/download/OdinPlus/OdinHorse/1.6.5/                          23a455aa79c074f2098107ea9f09f044460442d152732d928f511a16023209bc  root
    # TrashItems is deliberately NOT here. It is a client-side inventory-UI mod with no server
    # role, and it would contend with AzuExtendedPlayerInventory, which redraws the same screen.
    # Its dependency pin is BepInExPack 5.4.800 and it was last updated 2024-01, so it predates
    # AzuEPI's current version by ~2 years. Install it per-client and test the inventory UI.
    #
    # CookingStationTweaks (Grizzzly, 0.7.1) is deliberately NOT here. Evaluated 2026-07-29 and
    # declined. Its features are useful and it does NOT collide with V+ -- [Oven] there covers
    # only fuel, this covers slots, cook time, burning and auto-pop. Grizzzly's is the right
    # fork: 0.7.1 (2025-05) vs yeldarb420 0.6.0 (2024-06) vs digitiliad 0.2.0 (deprecated).
    #
    # It was declined because it has NO enforcement mechanism. It ships no ServerSync and no
    # Jotunn, so unlike everything else here it can neither kick mismatched clients (AzuEPI,
    # AzuContainerSizes do) nor push config from the server (ValheimPlus does, via
    # serverSyncsConfig). Correct client config would be convention, not mechanism.
    #
    # The failure mode is the one already documented for AzuContainerSizes below: a player on a
    # different SlotMultiplier -- or without the mod -- sees a DIFFERENT slot count on a shared
    # station, and food in the extra slots is invisible and unrecoverable to them. Silent and
    # per-player. If it is ever reconsidered, the artifact is sha256
    # 62c11fa57ca3ff34d0ef09942da77966835ce042ca03e378e7eb749398714477, 115605 bytes, layout
    # root, and its config file is aedenthorn.CookingStationTweaks.cfg.
    #
    # TeleportEverything (OdinPlus, 2.9.1) is deliberately NOT here either. Evaluated 2026-07-29.
    # It is a good mod -- 700K downloads, and unlike CookingStationTweaks it HAS server-synced
    # settings, so it does not carry that config-consistency problem. Its stated partial
    # incompatibilities (TargetPortal, CreatureLevelAndLootControl, UnrestrictedPortals) are all
    # absent here, and it does NOT conflict with XPortal: XPortal is an AnyPortal revamp that
    # manages portal naming/targeting, while this manages what may pass through.
    #
    # It was declined because V+ [Items] noTeleportPrevention -- one line, in a section already
    # enabled -- covers ores and ingots, which was most of the want. Knowingly given up: tamed
    # animals and carts through portals, enemy-follow modes, transport fees.
    #
    # ⚠️ If it is ever added, set [Items] noTeleportPrevention back to false -- both patch the
    # same check. Artifact: sha256
    # 266b6d6b1799796555d9d188963fdccd28578c9118aac2bc911d174a301807a8, 308447 bytes, layout root,
    # config file com.kpro.TeleportEverything.cfg. Would compose well with OdinHorse's horse and
    # horse cart, though its ally filter is mask/regex based so a custom creature may need config.

  # Per-mod BepInEx config, declared here instead of hand-edited on the PVC.
  #
  # Format: <cfg filename>|<Section>|<Key>|<Value>          (pipe-delimited; keys contain spaces)
  #
  # The image's BEPINEXCFG_<Section>_<Var> env mechanism CANNOT do this -- it only ever writes
  # BepInEx.cfg (`env2cfg --config "$config_path/BepInEx.cfg"` in common), never per-mod files.
  # Without this block those settings exist only as untracked edits on the volume.
  #
  # Applied on every boot, so this file is the source of truth: a value changed in-game or by a
  # mod's own config manager is reverted on the next restart. Change it here, not there.
  #
  # Only keys listed here are touched -- everything else in the .cfg keeps whatever the mod
  # wrote. Settings marked "[Synced with Server]" propagate to all clients automatically, so
  # they need no client-side action.
  # ⚠️ ONLY EVER GROW A CONTAINER. Every value below started at its range minimum, which is also
  # the vanilla default, so these are all increases. Shrinking a container that already holds
  # items puts those items in slots that no longer exist -- take a Longhorn snapshot first if you
  # ever reduce one.
  MOD_CONFIG: |
    Azumatt.AzuExtendedPlayerInventory.cfg|2 - Inventory|Extra Inventory Rows|5
    Azumatt.AzuContainerSizes.cfg|2 - Chests|Personal Chest Rows|4
    Azumatt.AzuContainerSizes.cfg|2 - Chests|Personal Chest Columns|4
    Azumatt.AzuContainerSizes.cfg|2 - Chests|Wood Chest Rows|4
    Azumatt.AzuContainerSizes.cfg|2 - Chests|Wood Chest Columns|6
    Azumatt.AzuContainerSizes.cfg|2 - Chests|Iron Chest Rows|6
    Azumatt.AzuContainerSizes.cfg|2 - Chests|Iron Chest Columns|8
    Azumatt.AzuContainerSizes.cfg|2 - Chests|Blackmetal Chest Rows|8
    Azumatt.AzuContainerSizes.cfg|2 - Chests|Blackmetal Chest Columns|8
    Azumatt.AzuContainerSizes.cfg|3 - Ships|Karve Rows|4
    Azumatt.AzuContainerSizes.cfg|3 - Ships|Karve Columns|4
    Azumatt.AzuContainerSizes.cfg|3 - Ships|Longboat Rows|5
    Azumatt.AzuContainerSizes.cfg|3 - Ships|Longboat Columns|8
    Azumatt.AzuContainerSizes.cfg|4 - Carts|Cart Rows|5
    Azumatt.AzuContainerSizes.cfg|4 - Carts|Cart Columns|8
    #
    # ValheimPlus: [Inventory] and [Wagon] are pinned OFF because they would fight other mods.
    # V+ ships with EVERY gameplay section enabled=false (only [ValheimPlus] and [Server] are on,
    # and both are meta), so these are already false -- pinning them makes it explicit and
    # drift-proof, because MOD_CONFIG is reapplied on every boot.
    #
    #   [Inventory] -> playerInventoryRows collides with AzuExtendedPlayerInventory, and
    #                  wood/personal/iron/blackmetal/cart/karve/longboat rows+columns collide
    #                  with every value set in AzuContainerSizes above. V+'s own README: "Player
    #                  inventory slot configuration is not compatible with Equipment and Quick
    #                  slots mod unless the Inventory section is disabled."
    #   [Wagon]     -> ⚠️ THIS PIN IS LOAD-BEARING FOR OdinHorse. It is not leftover caution.
    #                  wagonBaseMass sets the base mass of the wagon object outright (default 20).
    #                  OdinHorse's horse cart is deliberately too heavy for a player to drag --
    #                  that weight is the entire reason taming a horse is worth doing. Enabling
    #                  this section would stomp it back to draggable. This pin previously read as
    #                  a SkilledCarryWeight collision; that mod is gone and the pin still stays.
    #
    # Everything else in V+ is free to enable -- building, hotkeys, food, stamina, map, etc.
    valheim_plus.cfg|Inventory|enabled|false
    valheim_plus.cfg|Wagon|enabled|false
    #
    # [Player]: ENABLED. This section was pinned off while SkilledCarryWeight owned carry weight.
    # That mod has been removed -- it was incompatible with OdinHorse's horse cart -- so V+ now
    # owns carry weight outright and nothing else patches it.
    #
    # ⚠️ baseMaximumWeight and baseMegingjordBuff are ABSOLUTE VALUES, not percentages. This
    # inverts [Armor] and [Durability] further down this file, where the numbers ARE percentage
    # modifiers. 850 means 850 units, NOT +850%. Vanilla is 300 and 150 respectively.
    #
    # 850 replaces what SkilledCarryWeight gave at roughly average skill level 50 (300 base plus
    # ~550 summed across 24 skills). The tradeoff is deliberate and worth knowing before anyone
    # "restores progression": carry weight is now a CONSTANT rather than something skill levels
    # earn, so a new character starts with what previously took ~50 average levels to reach.
    # [Items] baseItemWeightReduction is -75, so everything weighs 25% -- 850 is roughly 3400
    # vanilla-equivalent hauling capacity.
    #
    # baseMegingjordBuff is pinned at its vanilla 150 deliberately. Enabling the section makes
    # every key in it live, so "unchanged from vanilla" is recorded as a decision rather than
    # left to chance.
    #
    # autoRepair and autoEquipShield were requested when this server was set up and refused ONLY
    # because [Player] was pinned off over the SkilledCarryWeight collision. That objection died
    # with the mod. autoUnequipShield is a SEPARATE key and stays at its default false.
    #
    # ⚠️ RE-VERIFY THIS SECTION ON ANY V+ UPGRADE. All 26 keys in [Player] were enumerated against
    # the generated valheim_plus.cfg at 9.17.1 and every one sits at a vanilla-equivalent default
    # (deathPenaltyMultiplier and fallDamageScalePercent are modifiers at 0; maxFallDamage 100 is
    # annotated "Game default is 100"; guardianBuffDuration 300 / Cooldown 1200 match vanilla;
    # iHaveArrivedOnSpawn is true because it is a DISABLE toggle -- "if set to false, disables the
    # 'I have arrived!' message" -- so true is the neutral state, not an opt-in).
    # That is what makes enabling the section neutral apart from the FIVE pin lines below. A future
    # release adding a non-neutral default would now take effect SILENTLY -- a pinned-off section
    # could not do that.
    #
    # ⚠️ "Five pins" and "four diff lines" below are BOTH correct and are different counts. Five
    # lines are pinned here; only four of them differ from V+'s shipped default, because
    # baseMegingjordBuff 150 is pinned TO the default. Do not reconcile them to a single number --
    # conflating the two is the exact miscount that put a wrong key count in this comment for
    # months.
    #
    # ⚠️ The count was 24 here until 2026-07-29 and was wrong; it had been asserted without ever
    # being enumerated. Do not re-verify by eye. ValheimPlus.dll EMBEDS the default cfg it writes
    # on first run, as plain text, so the check is a diff against the shipped defaults rather than
    # a judgement about what vanilla does -- and it covers [Gathering] and [Experience] too. The
    # runnable command is in README.md, "Re-verify [Player] on any V+ upgrade" -- use that, not a
    # snippet from here. In outline it is:
    #   D=/opt/valheim/bepinex/BepInEx/plugins/ValheimPlus/ValheimPlus.dll
    #   tr -c '[:print:]\n' '\n' < "$D" > /tmp/flat    # extracts the SHIPPED DEFAULTS only;
    #   awk -v s='[Player]' '$0==s{f=1;next} f&&/^\[/{f=0} f' /tmp/flat | grep -E '^[A-Za-z]+='
    # ...then diff that against the same section of the LIVE /config/bepinex/valheim_plus.cfg.
    # The two lines above do NOT read the live file and do NOT diff -- they are half the check.
    # Every line the diff reports must be one of the pins below. At 9.17.1 that was exactly four
    # diff lines -- enabled, baseMaximumWeight, autoRepair, autoEquipShield. baseMegingjordBuff 150
    # is the fifth pin and shows NO diff, because 150 is already the shipped default; that is the
    # pin working as intended, not a missing change.
    valheim_plus.cfg|Player|enabled|true
    valheim_plus.cfg|Player|baseMaximumWeight|850
    valheim_plus.cfg|Player|baseMegingjordBuff|150
    valheim_plus.cfg|Player|autoRepair|true
    valheim_plus.cfg|Player|autoEquipShield|true
    #
    # --- ValheimPlus gameplay tuning -------------------------------------------------------
    # ⚠️ THREE OF THESE READ BACKWARDS FROM THEIR NAMES. Verified against the comments in the
    # generated valheim_plus.cfg, not assumed:
    #   productionSpeed is SECONDS PER ITEM, not a percentage. "Twice as fast" means HALVING it.
    #     Setting 30 -> 60 would make smelters twice as SLOW.
    #   baseItemWeightReduction reduces on NEGATIVE values despite the name: "-50 will reduce
    #     item weight by 50%, 50 will increase". -75 is a 75% reduction.
    #   nightPercent is ABSOLUTE, not a modifier: "0 is all daytime, 100 is all nighttime".
    # Floats are fine -- [Building] areaRepairRadius ships as 7.5.
    #
    # Stamina: +100% regen, -50% on every drain.
    valheim_plus.cfg|Stamina|enabled|true
    valheim_plus.cfg|Stamina|staminaRegen|100
    valheim_plus.cfg|Stamina|staminaRegenDelay|-50
    valheim_plus.cfg|Stamina|runStaminaDrain|-50
    valheim_plus.cfg|Stamina|jumpStaminaDrain|-50
    valheim_plus.cfg|Stamina|sneakStaminaDrain|-50
    valheim_plus.cfg|Stamina|swimStaminaDrain|-50
    valheim_plus.cfg|Stamina|dodgeStaminaUsage|-50
    valheim_plus.cfg|Stamina|encumberedStaminaDrain|-50
    valheim_plus.cfg|StaminaUsage|enabled|true
    valheim_plus.cfg|StaminaUsage|axes|-50
    valheim_plus.cfg|StaminaUsage|blocking|-50
    valheim_plus.cfg|StaminaUsage|bows|-50
    valheim_plus.cfg|StaminaUsage|clubs|-50
    valheim_plus.cfg|StaminaUsage|knives|-50
    valheim_plus.cfg|StaminaUsage|pickaxes|-50
    valheim_plus.cfg|StaminaUsage|polearms|-50
    valheim_plus.cfg|StaminaUsage|spears|-50
    valheim_plus.cfg|StaminaUsage|swords|-50
    valheim_plus.cfg|StaminaUsage|unarmed|-50
    valheim_plus.cfg|StaminaUsage|hammer|-50
    valheim_plus.cfg|StaminaUsage|hoe|-50
    valheim_plus.cfg|StaminaUsage|cultivator|-50
    valheim_plus.cfg|StaminaUsage|fishing|-50
    # Food: lasts 100% longer, no degradation.
    valheim_plus.cfg|Food|enabled|true
    valheim_plus.cfg|Food|foodDurationMultiplier|100
    valheim_plus.cfg|Food|disableFoodDegradation|true
    # Map: shared exploration.
    valheim_plus.cfg|Map|enabled|true
    valheim_plus.cfg|Map|shareMapProgression|true
    # Time: night shortened to a third of vanilla, NOT removed. nightPercent is the share of the
    # whole day cycle that is night ("0 is all daytime, 100 is all nighttime", default 30).
    # totalDayTimeInSeconds is 1800, so: 30 -> 9 min of night, 10 -> 3 min, 5 -> 1.5 min.
    # Deliberately not 0 -- night still needs to exist for night-spawning mobs, light sources and
    # sleeping to remain meaningful.
    valheim_plus.cfg|Time|enabled|true
    valheim_plus.cfg|Time|nightPercent|10
    # Fires: torches/sconces/braziers and other fires keep infinite fuel, and pull wood from
    # nearby chests (autoRange stays at the default 10m).
    valheim_plus.cfg|FireSource|enabled|true
    valheim_plus.cfg|FireSource|torches|true
    valheim_plus.cfg|FireSource|fires|true
    valheim_plus.cfg|FireSource|autoFuel|true
    # Turret: both toggles on. The numeric modifiers stay at 0 (no change) -- raise them if you
    # want faster/further/more accurate turrets.
    valheim_plus.cfg|Turret|enabled|true
    valheim_plus.cfg|Turret|ignorePlayers|true
    valheim_plus.cfg|Turret|unlimitedAmmo|true
    # Armor: +50% on every slot, scaled back from +100%. This multiplier compounds with two
    # other sources -- Armory's upgraded biome-tier armor variants and EpicLoot's enchanted gear
    # -- so doubling it on top of both stacked up faster than any of the three assumed alone.
    # V+'s own example: base armor 14 -> 21 at +50%, -> 28 at +100%, before those other two.
    valheim_plus.cfg|Armor|enabled|true
    valheim_plus.cfg|Armor|helmets|50
    valheim_plus.cfg|Armor|chests|50
    valheim_plus.cfg|Armor|legs|50
    valheim_plus.cfg|Armor|capes|50
    # Durability: +100% on combat gear, +150% on tools. DISTINCT FROM [Armor] ABOVE -- that one raises
    # the armor VALUE (damage reduction), this one raises how long gear lasts before repair.
    # Enabling this section is what turns it on at all; it shipped enabled=false with every value
    # at 0, so this is a move from vanilla, not an increase on an existing bonus.
    #
    # Percent modifier, same convention as [Armor]: 100 takes durability 100 -> 200, -50 -> 50.
    #
    # ⚠️ DO NOT "fix" this to 50 for consistency with [Armor] above. The two look like they should
    # match and deliberately do not. [Armor] was scaled back from +100% because armor value is a
    # COMBAT BALANCE number -- it compounds with Armory's biome-tier variants and EpicLoot's
    # enchants into a character that is hard to kill. Durability is a CONVENIENCE number: it
    # changes how often you walk back to a workbench, not whether you survive. Doubling it was
    # asked for explicitly with that distinction on the table.
    #
    # Still compounds with two other sources, so the effective number exceeds +100% on some gear:
    #   EpicLoot's ModifyDurability enchant (a % roll on top of this, in magiceffects.json)
    #   Warfare's custom weapons, which set ABSOLUTE durability per item (Blackmetal Scimitar is
    #     200, +50/level) that this percentage then scales.
    #
    # Tools are at +150%, HIGHER than the +100% on combat gear above. ⚠️ That asymmetry is
    # deliberate -- do not "correct" it to match, for the same reason [Armor] and [Durability]
    # deliberately differ. Combat-gear durability is still adjacent to balance: it governs how
    # long you last in a fight before a weapon breaks. Tool durability is pure convenience --
    # it changes only how often you walk back to a workbench. Tools being the MORE generous
    # number follows from that distinction rather than contradicting it.
    #
    # This reverses an earlier decision. These five keys previously sat at vanilla 0 with a
    # comment saying tools were deliberately excluded because "the ask was weapons and armor".
    # Raising them was then asked for explicitly, with the convenience-vs-balance split above on
    # the table.
    #
    # `axes` stays at 100 with the WEAPONS, not with the tools. An axe is a weapon that also
    # chops wood and was raised on that basis; moving it here would be a combat-balance change
    # wearing a tools-change disguise.
    #
    # `torch` is grouped with the tools. It is a light source rather than a tool, but its
    # durability is burn time -- the same kind of convenience number.
    valheim_plus.cfg|Durability|enabled|true
    valheim_plus.cfg|Durability|weapons|100
    valheim_plus.cfg|Durability|axes|100
    valheim_plus.cfg|Durability|bows|100
    valheim_plus.cfg|Durability|shields|100
    valheim_plus.cfg|Durability|armor|100
    valheim_plus.cfg|Durability|pickaxes|150
    valheim_plus.cfg|Durability|hammer|150
    valheim_plus.cfg|Durability|cultivator|150
    valheim_plus.cfg|Durability|hoe|150
    valheim_plus.cfg|Durability|torch|150
    # Items: -75% weight, +100% stack size. Stack size lives in [Items], NOT the pinned
    # [Inventory] section, so it does not collide with AzuContainerSizes.
    #
    # noTeleportPrevention lifts vanilla's ban on carrying ores and ingots through a portal. V+'s
    # own description: "Enables you to teleport with ores and other usually teleport restricted
    # objects." Vanilla default is false.
    #
    # ⚠️ THIS COVERS ITEMS ONLY -- ores, ingots, dragon eggs. It does NOT teleport tamed animals
    # or carts. That was a deliberate trade: the OdinPlus/TeleportEverything mod does all of it,
    # and was evaluated and declined because this one line covers most of the want with no new
    # mod, no client install and nothing extra to keep updated. See the note beside MODS above.
    #
    # ⚠️ THERE ARE THREE POSSIBLE OWNERS OF THIS ONE BEHAVIOUR. Only this key is in use:
    #   1. this V+ key (in use)
    #   2. the OdinPlus/TeleportEverything mod -- evaluated and declined, see the note beside MODS
    #   3. the NATIVE `-modifier portals casual` world modifier, set via SERVER_ARGS in
    #      configmap.yaml, which lifts the same restriction with NO mod and NO config line
    #
    # Owner 3 was missed when this key was chosen -- the native modifier list was not checked, even
    # though configmap.yaml and README.md both document that `portals` exists in this build. The V+
    # key is KEPT anyway, deliberately, on reversibility grounds: configmap.yaml records that
    # "modifiers are saved into the world once set", whereas this pin is undone by editing this
    # file and restarting. The native route needs no mod but bakes into the world; this one is
    # reversible by config. That is the whole tradeoff -- re-examine it, do not assume it.
    #
    # ✅ THE PERSISTENCE QUESTION IS SETTLED -- modifiers ARE written into the world save. This was
    # once recorded here as an open contradiction between configmap.yaml and README.md; README.md
    # was the wrong one and that claim has been deleted. Evidence: TreeFellMeFirst.fwl (1745 bytes)
    # contains the string
    # `preset combat_default:deathpenalty_default:resources_more:raids_default:portals_default`
    # -- `resources_more` is a modifier that was set via SERVER_ARGS and is now baked into the
    # .fwl. configmap.yaml was right. So the reversibility argument above is
    # EVIDENCED, not asserted: the native `-modifier portals casual` route really does bake into
    # the world, while this V+ key is undone by editing this file. Do not reopen this as a question;
    # if you want to challenge it, re-read the .fwl, do not re-read the docs.
    #
    # ⚠️ IF TeleportEverything IS EVER INSTALLED, SET THIS BACK TO false. Both patch the same
    # "may this item teleport" check and the mod should own it -- same one-owner-per-property
    # discipline as the [Wagon] and [Inventory] pins.
    #
    # ⚠️ OVERRIDE DIRECTION -- INFERRED FROM PATCH MECHANICS, NOT TESTED. While this key is true, a
    # future `-modifier portals hard` is expected to be silently overridden: V+ applies a Harmony
    # patch to the teleport check at runtime, after the native modifier has been applied. Someone
    # will eventually set that modifier, see no change, and suspect the modifier never parsed.
    # Check this key FIRST. This ordering has NOT been verified -- deliberately, because a wrong
    # world modifier is written into the world and testing it on the live server is not free.
    valheim_plus.cfg|Items|enabled|true
    valheim_plus.cfg|Items|baseItemWeightReduction|-75
    valheim_plus.cfg|Items|itemStackMultiplier|100
    valheim_plus.cfg|Items|noTeleportPrevention|true
    # Building: no weather deterioration, structures indestructible.
    valheim_plus.cfg|Building|enabled|true
    valheim_plus.cfg|Building|noWeatherDamage|true
    valheim_plus.cfg|StructuralIntegrity|enabled|true
    valheim_plus.cfg|StructuralIntegrity|disableStructuralIntegrity|true
    valheim_plus.cfg|StructuralIntegrity|disableDamageToPlayerStructures|true
    # Craft/build/interact using nearby chests (one section covers all three).
    valheim_plus.cfg|CraftFromChest|enabled|true
    # Workbench: radius and attachment radius both doubled (meters, absolute).
    #
    # disableRoofCheck removes vanilla's requirement that a workbench be roofed and unexposed
    # before it will function at all. V+'s own description: "Disables the roof and exposure
    # requirement to use a workbench." Vanilla default is false.
    #
    # This is NOT the same thing as workbenchRange above -- range governs how far from a bench
    # you can build, while the roof check governs whether the bench works in the first place.
    # A sheltered bench already worked at 40m without this.
    #
    # Pairs with [Player] autoRepair: repair fires on interacting with a workbench, so while the
    # roof check stands, auto-repair only works under a roof. Both together are what make it
    # automatic anywhere.
    #
    # No new section is enabled here -- [Workbench] was already on for the two range values.
    valheim_plus.cfg|Workbench|enabled|true
    valheim_plus.cfg|Workbench|workbenchRange|40
    valheim_plus.cfg|Workbench|workbenchAttachmentRange|10
    valheim_plus.cfg|Workbench|disableRoofCheck|true
    # Production: capacity doubled, time halved (= twice the speed), pull/deposit from chests.
    valheim_plus.cfg|Smelter|enabled|true
    valheim_plus.cfg|Smelter|maximumOre|20
    valheim_plus.cfg|Smelter|maximumCoal|40
    valheim_plus.cfg|Smelter|productionSpeed|15
    valheim_plus.cfg|Smelter|autoDeposit|true
    valheim_plus.cfg|Smelter|autoFuel|true
    valheim_plus.cfg|Furnace|enabled|true
    valheim_plus.cfg|Furnace|maximumOre|20
    valheim_plus.cfg|Furnace|maximumCoal|40
    valheim_plus.cfg|Furnace|productionSpeed|15
    valheim_plus.cfg|Furnace|autoDeposit|true
    valheim_plus.cfg|Furnace|autoFuel|true
    valheim_plus.cfg|Kiln|enabled|true
    valheim_plus.cfg|Kiln|maximumWood|50
    valheim_plus.cfg|Kiln|productionSpeed|7.5
    valheim_plus.cfg|Kiln|autoDeposit|true
    valheim_plus.cfg|Kiln|autoFuel|true
    valheim_plus.cfg|Fermenter|enabled|true
    valheim_plus.cfg|Fermenter|fermenterDuration|1200
    valheim_plus.cfg|Fermenter|fermenterItemsProduced|12
    valheim_plus.cfg|Fermenter|autoDeposit|true
    valheim_plus.cfg|Fermenter|autoFuel|true
    valheim_plus.cfg|Beehive|enabled|true
    valheim_plus.cfg|Beehive|honeyProductionSpeed|600
    valheim_plus.cfg|Beehive|maximumHoneyPerBeehive|8
    valheim_plus.cfg|Beehive|autoDeposit|true
    valheim_plus.cfg|Windmill|enabled|true
    valheim_plus.cfg|Windmill|maximumBarley|100
    valheim_plus.cfg|Windmill|productionSpeed|5
    valheim_plus.cfg|Windmill|autoDeposit|true
    valheim_plus.cfg|Windmill|autoFuel|true
    valheim_plus.cfg|SpinningWheel|enabled|true
    valheim_plus.cfg|SpinningWheel|maximumFlax|100
    valheim_plus.cfg|SpinningWheel|productionSpeed|15
    valheim_plus.cfg|SpinningWheel|autoDeposit|true
    valheim_plus.cfg|SpinningWheel|autoFuel|true
    valheim_plus.cfg|EitrRefinery|enabled|true
    valheim_plus.cfg|EitrRefinery|maximumSap|40
    valheim_plus.cfg|EitrRefinery|maximumSoftTissue|40
    valheim_plus.cfg|EitrRefinery|productionSpeed|20
    valheim_plus.cfg|EitrRefinery|autoDeposit|true
    valheim_plus.cfg|EitrRefinery|autoFuel|true
    valheim_plus.cfg|Oven|enabled|true
    # [Oven] has NO autoDeposit key -- autoFuel is the only auto-* setting the section defines
    # (verified against the generated valheim_plus.cfg). Adding one would append a dead key that
    # V+ ignores. Same shape elsewhere: [Beehive] and [SapCollector] define autoDeposit but no
    # autoFuel (neither burns fuel), and [FireSource] defines autoFuel but no autoDeposit.
    valheim_plus.cfg|Oven|autoFuel|true
    valheim_plus.cfg|SapCollector|enabled|true
    valheim_plus.cfg|SapCollector|sapProductionSpeed|30
    valheim_plus.cfg|SapCollector|maximumSapPerCollector|20
    valheim_plus.cfg|SapCollector|autoDeposit|true
    # --- Gathering: double the yield from every node broken with a tool ---------------------
    # This was asked for as "increase tool damage". V+ CANNOT do that -- verified by enumerating
    # all 58 sections and every key containing "damage": the complete set is monster scaling,
    # unarmed, fall, structural and hull. There is no [Damage] section and no per-weapon-type
    # modifier. So this is a yield change, not a damage change: a rock still takes the same
    # number of swings, you just mine fewer rocks. [Experience] below is the damage half.
    #
    # ⚠️ COMPOUNDS with `-modifier resources more` in configmap.yaml -- a NATIVE global drop
    # multiplier already one step above normal. The effective multiplier is therefore MORE than
    # 2x, not exactly 2x. There are two independent sources; know which one you are changing.
    #
    # dropChance stays at 0 deliberately. It is a different mechanic: it raises the CHANCE on
    # nodes that have no guaranteed drop (dungeon scrap piles), not the AMOUNT from ore veins.
    #
    # feather is included for consistency, with a quirk worth knowing: it also affects drops
    # from shooting gulls and crows, not only trees.
    #
    # ⚠️ Enabling this section makes every key in it live. The ones not listed sit at 0, which is
    # a no-op -- same situation as [Player]. RE-VERIFY ON ANY V+ UPGRADE: a release adding a
    # non-neutral default here would now take effect silently.
    valheim_plus.cfg|Gathering|enabled|true
    valheim_plus.cfg|Gathering|wood|100
    valheim_plus.cfg|Gathering|fineWood|100
    valheim_plus.cfg|Gathering|coreWood|100
    valheim_plus.cfg|Gathering|elderBark|100
    valheim_plus.cfg|Gathering|yggdrasilWood|100
    valheim_plus.cfg|Gathering|blackwood|100
    valheim_plus.cfg|Gathering|stone|100
    valheim_plus.cfg|Gathering|grausten|100
    valheim_plus.cfg|Gathering|blackMarble|100
    valheim_plus.cfg|Gathering|tinOre|100
    valheim_plus.cfg|Gathering|copperOre|100
    valheim_plus.cfg|Gathering|copperScrap|100
    valheim_plus.cfg|Gathering|ironScrap|100
    valheim_plus.cfg|Gathering|silverOre|100
    valheim_plus.cfg|Gathering|chitin|100
    valheim_plus.cfg|Gathering|feather|100
    valheim_plus.cfg|Gathering|flametalOre|100
    valheim_plus.cfg|Gathering|proustitePowder|100
    # --- Experience: faster Pickaxes skill --------------------------------------------------
    # This is the ONLY route V+ offers to genuinely more pickaxe DAMAGE. Skill level scales tool
    # damage in vanilla, so levelling Pickaxes faster means fewer swings per rock. Unlike
    # [Gathering] above, this really is a damage increase rather than a yield increase.
    #
    # Self-limiting: once Pickaxes reaches 100 this contributes nothing further.
    #
    # Only pickaxes is raised. Every other skill stays at 0 (no-op); the section being enabled
    # makes them live, so adding another later is a one-line change. Same re-verify-on-upgrade
    # caveat as [Gathering] above.
    valheim_plus.cfg|Experience|enabled|true
    valheim_plus.cfg|Experience|pickaxes|100

  install-mods.sh: |
    #!/bin/bash
    # Idempotent, checksum-verified mod installer + declarative per-mod config.
    # Runs as an initContainer before the game container starts, so everything is in place for
    # the bootstrap rsync on the same boot.
    set -euo pipefail

    BEPINEX_CONFIG=/config/bepinex          # == BepInEx/config/ in the live install (symlink)
    PLUGINS="$BEPINEX_CONFIG/plugins"       # rsynced -> BepInEx/plugins/ at bootstrap
    STATE="$BEPINEX_CONFIG/.mod-state"      # install markers; deliberately NOT under plugins/
    TMP=/tmp/mods                           # emptyDir, so a failed download never litters the PVC

    mkdir -p "$PLUGINS" "$STATE" "$TMP"

    installed=0; skipped=0

    install_one() {
      local name=$1 ver=$2 url=$3 sha=$4 layout=$5
      local marker="$STATE/$name" want="$ver $sha"

      # Skip when the marker matches AND the payload is actually present. Warfare alone is
      # 182MB -- re-downloading the set on every restart would be slow and would hammer
      # Thunderstore for no reason.
      if [ -f "$marker" ] && [ "$(cat "$marker")" = "$want" ] && [ -d "$PLUGINS/$name" ]; then
        echo "[skip ] $name $ver (already installed)"
        skipped=$((skipped + 1))
        return 0
      fi

      echo "[fetch] $name $ver"
      local zip="$TMP/$name.zip"
      curl -fsSL --retry 3 --retry-delay 5 --max-time 900 -o "$zip" "$url"

      local got
      got=$(sha256sum "$zip" | cut -d' ' -f1)
      if [ "$got" != "$sha" ]; then
        echo "[FAIL ] $name checksum mismatch" >&2
        echo "         want $sha" >&2
        echo "         got  $got" >&2
        echo "         Refusing to install. This is executable code that runs inside the" >&2
        echo "         server -- a mismatch means the artifact changed or was tampered with." >&2
        exit 1
      fi

      local ex="$TMP/x-$name"
      rm -rf "$ex"; mkdir -p "$ex"
      unzip -q -o "$zip" -d "$ex"

      # Replace rather than merge, so an upgrade cannot leave stale files from the old version.
      rm -rf "${PLUGINS:?}/${name:?}"
      mkdir -p "$PLUGINS/$name"
      case "$layout" in
        plugins) cp -a "$ex/plugins/." "$PLUGINS/$name/" ;;
        bepinex) cp -a "$ex/BepInEx/plugins/." "$PLUGINS/$name/" ;;
        root)    find "$ex" -maxdepth 1 -type f -name '*.dll' -exec cp -a {} "$PLUGINS/$name/" \; ;;
        *)       echo "[FAIL ] $name: unknown layout '$layout'" >&2; exit 1 ;;
      esac

      # Thunderstore's config/ maps to BepInEx/config/, which is the /config/bepinex symlink.
      if [ -d "$ex/config" ]; then
        echo "[     ] $name: installing bundled config/ -> $BEPINEX_CONFIG/"
        cp -a "$ex/config/." "$BEPINEX_CONFIG/"
      fi

      rm -rf "$ex" "$zip"
      echo "$want" > "$marker"
      echo "[ok   ] $name $ver"
      installed=$((installed + 1))
    }

    # Sets one key in a BepInEx .cfg, touching nothing else in the file. Handles all four cases:
    # key present in section (replace in place), key absent but section present (append to that
    # section), section absent (create at end), file absent (create it -- BepInEx honours a
    # partial config and fills in the remaining defaults on first load, which is what makes this
    # work for a mod that has never run yet).
    # ⚠️ DO NOT "clean up" the norm() calls below. The CRLF handling is load-bearing TODAY (see
    # the note further down); the zero-width handling is now defensive, and both stay.
    # SkilledCarryWeight was the mod that needed the zero-width stripping: it prefixed keys and
    # sections with U+200B (E2 80 8B) to force sort order in its config manager, so its real key
    # was "<ZWSP>Enabled" and a literal comparison would append a SECOND, plain Enabled line that
    # the mod ignored -- while the applier reported success and changed nothing. That mod has
    # been removed, so nothing currently installed exercises this path. It is kept because the
    # failure mode is silent and expensive to rediscover, and because Thunderstore mods that
    # abuse zero-width characters for sort order are not rare.
    # Separator style is preserved per line, not normalised. BepInEx writes "Key = Value";
    # ValheimPlus writes "enabled=false" with no spaces and parses its own INI. Forcing spaces
    # into valheim_plus.cfg risks its parser reading " false" or missing the key entirely, so the
    # replacement copies whatever style the original line used.
    # CRLF matters too: ValheimPlus writes valheim_plus.cfg with \r\n, so "[Inventory]\r" never
    # equals "[Inventory]". norm() strips \r before comparing, and the \r is re-appended on write
    # so the file keeps consistent line endings. Without this every V+ pin would miss its section
    # and append a duplicate one at the end -- silently, while logging success.
    CFG_AWK='
    function norm(s,   t) { t=s; gsub(zw,"",t); gsub(bom,"",t); gsub(/\r/,"",t); gsub(/^[ \t]+|[ \t]+$/,"",t); return t }
    BEGIN { insec=0; done=0; sawsec=0 }
    {
      line=$0
      if (line ~ /^[ \t]*\[/) {
        if (insec && !done) { print k sep v; done=1 }
        insec = (norm(line) == "[" norm(sec) "]"); if (insec) sawsec=1
        print line; next
      }
      if (insec && !done && line !~ /^[ \t]*[#;]/) {
        eq = index(line, "=")
        if (eq > 0) { lhs = substr(line,1,eq-1)
          if (norm(lhs) == norm(k)) { okey=lhs; gsub(/[ \t]+$/,"",okey)
            s = (lhs ~ /[ \t]$/) ? " = " : "="
            cr = (line ~ /\r$/) ? "\r" : ""
            print okey s v cr; done=1; next } }
      }
      print line
    }
    END { if (!done) { if (insec) print k sep v
           else if (!sawsec) { print ""; print "[" sec "]"; print k sep v } } }'

    ZW=$(printf '\342\200\213')    # U+200B zero width space
    BOM=$(printf '\357\273\277')   # U+FEFF byte order mark

    set_cfg() {
      local file=$1 section=$2 key=$3 value=$4
      local path="$BEPINEX_CONFIG/$file"
      if [ ! -f "$path" ]; then
        printf '[%s]\n\n%s = %s\n' "$section" "$key" "$value" > "$path"
        echo "[cfg  ] $file [$section] $key = $value (created)"
        return 0
      fi
      awk -v zw="$ZW" -v bom="$BOM" -v sep=" = " -v sec="$section" -v k="$key" -v v="$value" \
        "$CFG_AWK" "$path" > "$path.new"
      mv "$path.new" "$path"
      echo "[cfg  ] $file [$section] $key = $value"
    }

    echo "=== valheim mod installer ==="
    while read -r name ver url sha layout; do
      [ -z "${name:-}" ] && continue
      case "$name" in \#*) continue ;; esac
      install_one "$name" "$ver" "$url" "$sha" "$layout"
    done <<< "$MODS"

    # --- prune: mods no longer listed in MODS --------------------------------------------
    # Deleting a line from MODS used to be insufficient. The staged copy survived here, and the
    # image's bootstrap sync is `rsync -a` with NO --delete, so the stale DLL also survived in
    # the live install -- a "removed" mod kept running. Both copies are pruned here, which is
    # what makes removal declarative.
    #
    # ⚠️ $PLUGINS is on valheim-data, the SAME Longhorn volume as /config/worlds_local. Every rm
    # below uses ${VAR:?}, so an unset or empty path aborts the script instead of expanding to a
    # bare root path. Do NOT rewrite these as plain "$VAR" -- that is the one bug in this file
    # that could reach the world save.
    LIVE_PLUGINS=/opt/valheim/bepinex/BepInEx/plugins

    keep=$(while read -r name _rest; do
             [ -z "${name:-}" ] && continue
             case "$name" in \#*) continue ;; esac
             printf '%s\n' "$name"
           done <<< "$MODS")

    # An EMPTY MODS -- the ConfigMap key missing, or its block scalar emptied -- must never be read
    # as "delete everything". That is all this guard covers. It does NOT cover a truncated MODS: a
    # block scalar clipped mid-list still parses to a perfectly valid non-empty set and walks
    # straight past here. The bulk-prune breaker below is what catches truncation. Do not read
    # this guard as protecting against malformed input generally -- it protects against one shape
    # of it.
    if [ -z "$keep" ]; then
      echo "[FAIL ] MODS parsed to an empty set -- refusing to prune" >&2
      exit 1
    fi

    # Single source of truth for "does MODS still list this directory name?". The pre-flight count
    # and the removal itself both go through it, so the breaker can never disagree about what the
    # prune then deletes.
    # `grep` exits 1 on no-match. Every caller below puts that in a tested position (`if !` or
    # `||`), where a non-zero exit is the condition being tested and is NOT fatal under `set -e`.
    # Do not call this bare, and do not "simplify" a caller into an untested command.
    # ⚠️ The herestring is deliberate -- do NOT "simplify" it back to `printf ... | grep -qxF`.
    # Under `set -o pipefail`, if `grep -q` exits on a match before `printf` has finished writing,
    # `printf` takes SIGPIPE and the pipeline returns non-zero -- inverting this test and deleting
    # a mod that MODS still lists, on the same Longhorn volume as the world save. `keep` is ~250
    # bytes today so it fits the pipe buffer atomically and this cannot fire, but the failure mode
    # is silent and destructive and the size is not guaranteed. A herestring has no pipeline.
    is_kept() {
      grep -qxF "$1" <<< "$keep"
    }

    # Directory names present under a root that MODS no longer lists.
    doomed_in() {
      local root=$1 d n
      [ -d "$root" ] || return 0
      for d in "$root"/*/; do
        [ -d "$d" ] || continue
        n=$(basename "$d")
        is_kept "$n" || printf '%s\n' "$n"
      done
    }

    # DISTINCT names across both roots -- `sort -u`, deliberately NOT the sum of the two counts.
    # A mod is normally present in the staged copy AND the live install, so summing would double
    # every removal and trip the breaker below at half its intended threshold, on an ordinary
    # two-mod change.
    doomed=$( { doomed_in "$PLUGINS"; doomed_in "$LIVE_PLUGINS"; } | sort -u )
    if [ -z "$doomed" ]; then
      doomed_n=0
    else
      doomed_n=$(printf '%s\n' "$doomed" | wc -l | tr -d '[:space:]')
    fi

    # --- bulk-prune circuit breaker -------------------------------------------------------
    # ⚠️ DO NOT raise this threshold to push a large cleanup through, and do NOT delete it on the
    # grounds that the empty-set guard above already covers bad input. It does not. A MODS block
    # scalar clipped mid-list by a bad edit still parses to a valid, non-empty set, and the prune
    # would then read every mod BELOW the cut as deliberately removed and delete it from both
    # plugin dirs and its marker -- silently, while logging success.
    #
    # Restoring the clipped line does NOT undo that. EpicLoot, Warfare, Armory and
    # OdinsFoodBarrels register prefabs whose placed instances are persisted as ZDOs in
    # TreeFellMeFirst.db. Boot once without the DLL and those ZDOs are orphaned; reinstalling the
    # mod later brings back the item definitions, not the objects players had built or dropped.
    # That is why this is a hard refusal and not a warning.
    #
    # A deliberate removal in this repo is one mod at a time. More than two in a single boot is
    # the signature of a clipped MODS block, not an intention. Failing the initContainer keeps the
    # pod down until a human looks -- recoverable. A wrongly pruned world is not.
    if [ "$doomed_n" -gt 2 ] && [ "${PRUNE_ALLOW_BULK:-}" != "yes" ]; then
      doomed_list=$(printf '%s\n' "$doomed" | tr '\n' ' ')
      echo "[FAIL ] prune would remove $doomed_n mods in a single boot: $doomed_list" >&2
      echo "         Refusing. More than 2 at once usually means the MODS block in" >&2
      echo "         mods-configmap.yaml was truncated, not that this many mods were dropped." >&2
      echo "         Check MODS still lists every mod you expect before doing anything else." >&2
      echo "         If this removal really is intended, add to the fetch-mods container in" >&2
      echo "         deployment.yaml an env var PRUNE_ALLOW_BULK with value \"yes\", apply, let" >&2
      echo "         it boot once, then remove it again." >&2
      exit 1
    fi

    prune_dir() {
      local root=$1 label=$2 d n
      if [ ! -d "$root" ]; then
        echo "[prune] $label: $root absent, nothing to do"
        return 0
      fi
      for d in "$root"/*/; do
        [ -d "$d" ] || continue
        n=$(basename "$d")
        if ! is_kept "$n"; then
          echo "[prune] $label: removing $n (not in MODS)"
          rm -rf "${root:?}/${n:?}"
        fi
      done
    }

    echo "=== pruning mods no longer in MODS ($doomed_n to remove) ==="
    prune_dir "$PLUGINS"      "staged"
    prune_dir "$LIVE_PLUGINS" "live"

    # Orphaned install markers go too, so re-adding a mod later reinstalls it cleanly instead of
    # being skipped by a stale version+sha marker.
    #
    # Markers are deliberately NOT counted by the breaker above: a marker is regenerable metadata,
    # and one left behind with no plugin dir is a cosmetic inconsistency, not data loss. The
    # breaker exits before this loop anyway, so a truncation large enough to trip the breaker
    # never reaches it.
    for m in "$STATE"/*; do
      [ -f "$m" ] || continue
      n=$(basename "$m")
      if ! is_kept "$n"; then
        echo "[prune] marker: removing $n"
        rm -f "${STATE:?}/${n:?}"
      fi
    done

    echo "=== applying per-mod config ==="
    while IFS='|' read -r file section key value; do
      [ -z "${file:-}" ] && continue
      case "$file" in \#*) continue ;; esac
      set_cfg "$file" "$section" "$key" "$value"
    done <<< "${MOD_CONFIG:-}"

    # Match the ownership the game container expects (PUID/PGID 10000).
    chown -R 10000:10000 "$BEPINEX_CONFIG"

    echo "=== done: $installed installed, $skipped already present ==="
    echo "--- BepInEx/plugins staged on the PVC ---"
    ls -1 "$PLUGINS"
