    #
    # Not changed, but adjacent if wanted: [Crops] CropsRequireSunlight is true, so crops will not
    # grow under a roof -- the same restriction family as the workbench roof check lifted above.
    #
    # --- Recycle_N_Reclaim: un-craft at a station, discard from the inventory ---------------
    # Section names are NUMBERED -- "1 - General", "2 - Inventory Recycle", "3 - Reclaiming",
    # "4 - UI" -- NOT the bare names the Thunderstore page lists. Verified against literals in
    # the 1.4.0 DLL. Pinning the bare names would append four duplicate sections that the mod
    # ignores, while logging ten successful [cfg ] lines.
    #
    # ⚠️ ReturnEnchantedResources appears TWICE on purpose. The key genuinely exists in
    # both [2 - Inventory Recycle] and [3 - Reclaiming], governing the discard path and the
    # reclaim path independently. Deleting either line as a duplicate reopens one of them.
    #
    # Lock Configuration = true: clients cannot override server config locally, matching
    # this file's rule that MOD_CONFIG is the source of truth and in-game edits are
    # reverted on the next boot.
    #
    # ReturnEnchantedResources = false (both): EpicLoot's Sacrifice at the Enchanter stays
    # the ONLY conversion path for magic gear, at EpicLoot's own balance. The mod's README
    # confirms the overlap is real -- "If on and Epic Loot or Jewelcrafting is installed,
    # discarding an item in the inventory will return resources for Epic Loot".
    #
    # AllowRecyclingUnknownRecipes / ReturnUnknownResources = false: EpicLoot, Warfare and
    # Armory all add loot drops. Without these, a lucky Meadows drop converts into
    # out-of-tier materials and skips a biome.
    #
    # PreventZeroResourceYields / UnstackableItemsAlwaysReturnAtLeastOneResource = true:
    # at RecyclingRate 0.5 a 1-unit item yields 0.5 -> nothing. Without these, recycling
    # cheap gear silently consumes it for no return.
    #
    # RecyclingRate is pinned at the mod's own default so the value is recorded as a
    # decision rather than left to drift, the same reason baseMegingjordBuff is pinned at
    # its vanilla 150 above.
    #
    # NOT pinned, deliberately: RequireExactCraftingStationForRecycling (default on, the
    # author's note says it keeps behaviour close to vanilla); all keybinds (client-side
    # preference); EnableExperimentalCraftingTabUI (default on, and it appears to BE the
    # Reclaim tab -- ⚠️ first thing to toggle if the crafting UI misbehaves).
    #
    # ⚠️ NOT MANAGEABLE HERE: the mod also reads Azumatt.Recycle_N_Reclaim_ExcludeLists.yml,
    # whose recycleRates block overrides RecyclingRate per item. MOD_CONFIG is INI
    # key=value only and cannot manage a YAML side-file, so the global 0.5 applies to
    # everything. Per-item rates would need a new mechanism in install-mods.sh.
    # ⚠️ VALUES ARE On/Off, NOT true/false. Every boolean-looking key here is
    # "Setting type: Toggle" -- a two-member enum {Off, On} -- so BepInEx rejects
    # `true`/`false` with "Requested value 'true' was not found" and silently keeps the
    # mod's own default. RecyclingRate is the one genuine primitive (a float).
    #
    # 🚨 THIS SHIPPED WRONG ONCE, ON 2026-07-31. All nine Toggle keys were first written as
    # true/false. The installer logged ten successful [cfg ] lines; nine were discarded by
    # BepInEx. It was NOT caught by the config-file check either -- the file looked healthy,
    # because the values in it were the mod's defaults, correctly formatted. The ONLY place
    # it surfaced was the game container's own log:
    #   kubectl logs -n valheim deploy/valheim -c valheim | Select-String "could not be parsed"
    # Six of the nine happened to match the mod's defaults and looked fine. Three did not:
    # both ReturnEnchantedResources keys stayed On (EpicLoot guard inactive) and
    # Lock to Admin stayed On (inventory discard admin-only). Add that grep to the checks
    # after ANY MOD_CONFIG change, for any mod -- a [cfg ] line means the applier wrote
    # the file, never that the mod accepted the value.
    #
    # Before adding a key here, read its "# Setting type:" line in the generated .cfg on the
    # PVC. Toggle -> On/Off. Do not infer the type from the key reading like a boolean.
    #
    # ✅ VERIFIED IN-GAME 2026-08-01, against the CORRECTED On/Off values. All four checks
    # passed: reclaim returns ~50% at the correct station; an EpicLoot magic item returned NO
    # enchanting materials by either the reclaim or the discard path; an item whose recipe was
    # not yet unlocked was REFUSED; a 1-unit item returned 1, not 0. AzuEPI's 5 extra rows and
    # quick slots still render alongside the trash slot -- the contention accepted above did
    # not materialise.
    #
    # ⚠️ The middle three are the NEGATIVE cases -- each guard was seen REFUSING, not merely
    # seen not misbehaving. That distinction is load-bearing here: run against the ORIGINAL
    # true/false pins these same checks would have passed for the wrong reason, because
    # AllowRecyclingUnknownRecipes and ReturnUnknownResources happened to match the mod's
    # defaults. The EpicLoot checks would have FAILED, which is what makes them the ones worth
    # re-running after any version bump.
    Azumatt.Recycle_N_Reclaim.cfg|1 - General|Lock Configuration|On
    Azumatt.Recycle_N_Reclaim.cfg|2 - Inventory Recycle|Enabled|On
    Azumatt.Recycle_N_Reclaim.cfg|2 - Inventory Recycle|Lock to Admin|Off
    Azumatt.Recycle_N_Reclaim.cfg|2 - Inventory Recycle|ReturnEnchantedResources|Off
    Azumatt.Recycle_N_Reclaim.cfg|2 - Inventory Recycle|ReturnUnknownResources|Off
    Azumatt.Recycle_N_Reclaim.cfg|3 - Reclaiming|RecyclingRate|0.5
    Azumatt.Recycle_N_Reclaim.cfg|3 - Reclaiming|ReturnEnchantedResources|Off
    Azumatt.Recycle_N_Reclaim.cfg|3 - Reclaiming|AllowRecyclingUnknownRecipes|Off
    Azumatt.Recycle_N_Reclaim.cfg|3 - Reclaiming|PreventZeroResourceYields|On
    Azumatt.Recycle_N_Reclaim.cfg|3 - Reclaiming|UnstackableItemsAlwaysReturnAtLeastOneResource|On
    #
    # --- LazyVikings: ONLY the two cooking stations are enabled ----------------------------
    #
    # ⚠️ SECTION NAMES ARE "NN- Name" -- zero-padded, NO space before the dash, one space
    # after. This is a THIRD convention in this file: Azumatt uses "2 - Inventory Recycle",
    # ValheimPlus uses bare [Time], this uses "05- Cooking Station". Recovered from literals
    # in the 1.2.3 DLL. A regex written for one convention silently misses the others -- the
    # first recon pass here searched for "N - Name" and found nothing, which read as a clean
    # negative result.
    #
    # 🚨 VALUES ARE On/Off, NOT true/false. Every description in the mod reads "If On, ..."
    # and the setting type is Toggle. This is the same failure that cost two restarts on
    # Recycle_N_Reclaim on 2026-07-31: BepInEx rejects true/false, keeps the mod's own
    # default, and the installer logs a successful [cfg ] line anyway. After applying, ALWAYS:
    #   kubectl logs -n valheim deploy/valheim -c valheim | Select-String "could not be parsed"
    # Empty is the pass.
    #
    # 🚨 THE FOURTEEN "Off" LINES ARE LOAD-BEARING. They are not redundant defaults. Eleven
    # of the fourteen name a station ValheimPlus ALREADY automates, and turning one On would
    # put two mods on the same station. The remaining three (08- Hot Tub, 17- Steel Kiln,
    # 18- Steel Slack Tub) are pinned off for consistency instead: V+'s [HotTub] exists but
    # is disabled, and the Steel pieces come from OdinSteelWorks, which is not installed here.
    #   03- Beehive         -> V+ [Beehive] autoDeposit
    #   04- Blast Furnace   -> V+ [Furnace] autoDeposit/autoFuel -- ⚠️ V+ calls the Blast
    #                          Furnace "[Furnace]", NOT "[BlastFurnace]". This row was
    #                          originally and wrongly written as "not present here".
    #   06- Eitr Refinery   -> V+ [EitrRefinery] autoDeposit/autoFuel
    #   07- Fermenter       -> V+ [Fermenter] autoDeposit/autoFuel
    #   08- Hot Tub         -> V+ [HotTub] exists but is enabled=false; off for consistency
    #   10- Kiln            -> V+ [Kiln] autoDeposit/autoFuel
    #   11- SapCollector    -> V+ [SapCollector] autoDeposit
    #   12- Smelter         -> V+ [Smelter] autoDeposit/autoFuel
    #   13- Spinning Wheel  -> V+ [SpinningWheel] autoDeposit/autoFuel
    #   14- Stone Oven      -> V+ [Oven] autoFuel
    #   15- Windmill        -> V+ [Windmill] autoDeposit/autoFuel
    #   16- Fireplace       -> V+ [FireSource] autoFuel
    #   17- Steel Kiln      -> OdinSteelWorks piece; that mod is not installed here; off for
    #                          consistency
    #   18- Steel Slack Tub -> OdinSteelWorks piece; that mod is not installed here; off for
    #                          consistency
    # DO NOT "tidy up" these lines.
    #
    # 02- General is deliberately not pinned. ENUMERATED 2026-08-02 after first boot: it holds
    # only "Leave One = On" (never fully drains a chest) and "Must Have = Off". There is NO
    # global automation master switch, so containment rests entirely on the fourteen Off pins
    # above -- that assumption is now observed, not assumed.
    #
    # ⚠️ Radius = 5 (per station, acceptable 1-50, left at the mod's default). That is TIGHT:
    # V+ stations use autoRange 10 and V+ [CraftFromChest] uses 30. A chest must be almost
    # adjacent to the grill. If auto-cooking "does not work", check the chest distance BEFORE
    # suspecting the pins.
    #
    # ⚠️ Automation = Both (per station, default; a THIRD setting type -- "Setting type:
    # Automation", values Deposit/Fuel/Both). It does not only ADD raw food, it also DEPOSITS
    # cooked food back into nearby containers. Combined with General's Must Have = Off, cooked
    # food can land in ANY container within 5m, not only one already holding that item. This is
    # fuller smelter-parity than the design specified -- recorded because it is behaviour
    # nobody asked for and someone will eventually report it as a bug.
    #
    # ✅ VERIFIED IN-GAME 2026-08-02, immediately after the apply:
    #   - 09- Iron Cooking Station: a chest built directly beside it and filled with raw meat
    #     was drawn from, cooked unattended with no player interaction, and the cooked meat was
    #     deposited back into that chest. Both halves of Automation=Both confirmed.
    #   - CONTAINMENT (the checks that matter): smelter, blast furnace and the other V+-owned
    #     stations observed still working as before. The fourteen Off pins held.
    #   - ⚠️ NOT separately tested: 05- Cooking Station (the regular grill). It carries
    #     identical pins and identical generated settings to 09, so it is expected equivalent,
    #     but only 09 was actually exercised. Test it if you ever need certainty.
    #   - ⚠️ Containment was an operator observation ("working as intended still"), not an
    #     instrumented measurement of consumption rate. A subtle double-feed would not
    #     necessarily have shown up. Good enough to proceed; not proof against a slow leak.
    blacks7ar.LazyVikings.cfg|01- ServerSync|Lock Configuration|On
    blacks7ar.LazyVikings.cfg|05- Cooking Station|Enable|On
    blacks7ar.LazyVikings.cfg|09- Iron Cooking Station|Enable|On
    blacks7ar.LazyVikings.cfg|03- Beehive|Enable|Off
    blacks7ar.LazyVikings.cfg|04- Blast Furnace|Enable|Off
    blacks7ar.LazyVikings.cfg|06- Eitr Refinery|Enable|Off
    blacks7ar.LazyVikings.cfg|07- Fermenter|Enable|Off
    blacks7ar.LazyVikings.cfg|08- Hot Tub|Enable|Off
    blacks7ar.LazyVikings.cfg|10- Kiln|Enable|Off
    blacks7ar.LazyVikings.cfg|11- SapCollector|Enable|Off
    blacks7ar.LazyVikings.cfg|12- Smelter|Enable|Off
    blacks7ar.LazyVikings.cfg|13- Spinning Wheel|Enable|Off
    blacks7ar.LazyVikings.cfg|14- Stone Oven|Enable|Off
    blacks7ar.LazyVikings.cfg|15- Windmill|Enable|Off
    blacks7ar.LazyVikings.cfg|16- Fireplace|Enable|Off
    blacks7ar.LazyVikings.cfg|17- Steel Kiln|Enable|Off
    blacks7ar.LazyVikings.cfg|18- Steel Slack Tub|Enable|Off

  install-mods.sh: |
    #!/bin/bash
    # Idempotent, checksum-verified mod installer + declarative per-mod config.
    # Runs as an initContainer before the game container starts, so everything is in place for
    # the bootstrap rsync on the same boot.
    set -euo pipefail

    BEPINEX_CONFIG=/config/bepinex          # == BepInEx/config/ in the live install (symlink)
    PLUGINS="$BEPINEX_CONFIG/plugins"       # rsynced -> BepInEx/plugins/ at bootstrap
    STATE="$BEPINEX_CONFIG/.mod-state"      # install markers; deliberately NOT under plugins/
    TMP=/tmp/mods                           # emptyDir, so a failed download never litters the PVC

    mkdir -p "$PLUGINS" "$STATE" "$TMP"

    installed=0; skipped=0

    install_one() {
      local name=$1 ver=$2 url=$3 sha=$4 layout=$5
      local marker="$STATE/$name" want="$ver $sha"

      # Skip when the marker matches AND the payload is actually present. Warfare alone is
      # 182MB -- re-downloading the set on every restart would be slow and would hammer
      # Thunderstore for no reason.
      if [ -f "$marker" ] && [ "$(cat "$marker")" = "$want" ] && [ -d "$PLUGINS/$name" ]; then
        echo "[skip ] $name $ver (already installed)"
        skipped=$((skipped + 1))
        return 0
      fi

      echo "[fetch] $name $ver"
      local zip="$TMP/$name.zip"
      curl -fsSL --retry 3 --retry-delay 5 --max-time 900 -o "$zip" "$url"

      local got
      got=$(sha256sum "$zip" | cut -d' ' -f1)
      if [ "$got" != "$sha" ]; then
        echo "[FAIL ] $name checksum mismatch" >&2
        echo "         want $sha" >&2
        echo "         got  $got" >&2
        echo "         Refusing to install. This is executable code that runs inside the" >&2
        echo "         server -- a mismatch means the artifact changed or was tampered with." >&2
        exit 1
      fi

      local ex="$TMP/x-$name"
      rm -rf "$ex"; mkdir -p "$ex"
      unzip -q -o "$zip" -d "$ex"

      # Replace rather than merge, so an upgrade cannot leave stale files from the old version.
      rm -rf "${PLUGINS:?}/${name:?}"
      mkdir -p "$PLUGINS/$name"
      case "$layout" in
        plugins) cp -a "$ex/plugins/." "$PLUGINS/$name/" ;;
        bepinex) cp -a "$ex/BepInEx/plugins/." "$PLUGINS/$name/" ;;
        root)    find "$ex" -maxdepth 1 -type f -name '*.dll' -exec cp -a {} "$PLUGINS/$name/" \; ;;
        *)       echo "[FAIL ] $name: unknown layout '$layout'" >&2; exit 1 ;;
      esac

      # Thunderstore's config/ maps to BepInEx/config/, which is the /config/bepinex symlink.
      if [ -d "$ex/config" ]; then
        echo "[     ] $name: installing bundled config/ -> $BEPINEX_CONFIG/"
        cp -a "$ex/config/." "$BEPINEX_CONFIG/"
      fi

      rm -rf "$ex" "$zip"
      echo "$want" > "$marker"
      echo "[ok   ] $name $ver"
      installed=$((installed + 1))
    }

    # Sets one key in a BepInEx .cfg, touching nothing else in the file. Handles all four cases:
    # key present in section (replace in place), key absent but section present (append to that
    # section), section absent (create at end), file absent (create it -- BepInEx honours a
    # partial config and fills in the remaining defaults on first load, which is what makes this
    # work for a mod that has never run yet).
    # ⚠️ DO NOT "clean up" the norm() calls below. The CRLF handling is load-bearing TODAY (see
    # the note further down); the zero-width handling is now defensive, and both stay.
    # SkilledCarryWeight was the mod that needed the zero-width stripping: it prefixed keys and
    # sections with U+200B (E2 80 8B) to force sort order in its config manager, so its real key
    # was "<ZWSP>Enabled" and a literal comparison would append a SECOND, plain Enabled line that
    # the mod ignored -- while the applier reported success and changed nothing. That mod has
    # been removed, so nothing currently installed exercises this path. It is kept because the
    # failure mode is silent and expensive to rediscover, and because Thunderstore mods that
    # abuse zero-width characters for sort order are not rare.
    # Separator style is preserved per line, not normalised. BepInEx writes "Key = Value";
    # ValheimPlus writes "enabled=false" with no spaces and parses its own INI. Forcing spaces
    # into valheim_plus.cfg risks its parser reading " false" or missing the key entirely, so the
    # replacement copies whatever style the original line used.
    # CRLF matters too: ValheimPlus writes valheim_plus.cfg with \r\n, so "[Inventory]\r" never
    # equals "[Inventory]". norm() strips \r before comparing, and the \r is re-appended on write
    # so the file keeps consistent line endings. Without this every V+ pin would miss its section
    # and append a duplicate one at the end -- silently, while logging success.
    CFG_AWK='
    function norm(s,   t) { t=s; gsub(zw,"",t); gsub(bom,"",t); gsub(/\r/,"",t); gsub(/^[ \t]+|[ \t]+$/,"",t); return t }
    BEGIN { insec=0; done=0; sawsec=0 }
    {
      line=$0
      if (line ~ /^[ \t]*\[/) {
        if (insec && !done) { print k sep v; done=1 }
        insec = (norm(line) == "[" norm(sec) "]"); if (insec) sawsec=1
        print line; next
      }
      if (insec && !done && line !~ /^[ \t]*[#;]/) {
        eq = index(line, "=")
        if (eq > 0) { lhs = substr(line,1,eq-1)
          if (norm(lhs) == norm(k)) { okey=lhs; gsub(/[ \t]+$/,"",okey)
            s = (lhs ~ /[ \t]$/) ? " = " : "="
            cr = (line ~ /\r$/) ? "\r" : ""
            print okey s v cr; done=1; next } }
      }
      print line
    }
    END { if (!done) { if (insec) print k sep v
           else if (!sawsec) { print ""; print "[" sec "]"; print k sep v } } }'

    ZW=$(printf '\342\200\213')    # U+200B zero width space
    BOM=$(printf '\357\273\277')   # U+FEFF byte order mark

    set_cfg() {
      local file=$1 section=$2 key=$3 value=$4
      local path="$BEPINEX_CONFIG/$file"
      if [ ! -f "$path" ]; then
        printf '[%s]\n\n%s = %s\n' "$section" "$key" "$value" > "$path"
        echo "[cfg  ] $file [$section] $key = $value (created)"
        return 0
      fi
      awk -v zw="$ZW" -v bom="$BOM" -v sep=" = " -v sec="$section" -v k="$key" -v v="$value" \
        "$CFG_AWK" "$path" > "$path.new"
      mv "$path.new" "$path"
      echo "[cfg  ] $file [$section] $key = $value"
    }

    echo "=== valheim mod installer ==="
    while read -r name ver url sha layout; do
      [ -z "${name:-}" ] && continue
      case "$name" in \#*) continue ;; esac
      install_one "$name" "$ver" "$url" "$sha" "$layout"
    done <<< "$MODS"

    # --- prune: mods no longer listed in MODS --------------------------------------------
    # Deleting a line from MODS used to be insufficient. The staged copy survived here, and the
    # image's bootstrap sync is `rsync -a` with NO --delete, so the stale DLL also survived in
    # the live install -- a "removed" mod kept running. Both copies are pruned here, which is
    # what makes removal declarative.
    #
    # ⚠️ $PLUGINS is on valheim-data, the SAME Longhorn volume as /config/worlds_local. Every rm
    # below uses ${VAR:?}, so an unset or empty path aborts the script instead of expanding to a
    # bare root path. Do NOT rewrite these as plain "$VAR" -- that is the one bug in this file
    # that could reach the world save.
    LIVE_PLUGINS=/opt/valheim/bepinex/BepInEx/plugins

    keep=$(while read -r name _rest; do
             [ -z "${name:-}" ] && continue
             case "$name" in \#*) continue ;; esac
             printf '%s\n' "$name"
           done <<< "$MODS")

    # An EMPTY MODS -- the ConfigMap key missing, or its block scalar emptied -- must never be read
    # as "delete everything". That is all this guard covers. It does NOT cover a truncated MODS: a
    # block scalar clipped mid-list still parses to a perfectly valid non-empty set and walks
    # straight past here. The bulk-prune breaker below is what catches truncation. Do not read
    # this guard as protecting against malformed input generally -- it protects against one shape
    # of it.
    if [ -z "$keep" ]; then
      echo "[FAIL ] MODS parsed to an empty set -- refusing to prune" >&2
      exit 1
    fi

    # Single source of truth for "does MODS still list this directory name?". The pre-flight count
    # and the removal itself both go through it, so the breaker can never disagree about what the
    # prune then deletes.
    # `grep` exits 1 on no-match. Every caller below puts that in a tested position (`if !` or
    # `||`), where a non-zero exit is the condition being tested and is NOT fatal under `set -e`.
    # Do not call this bare, and do not "simplify" a caller into an untested command.
    # ⚠️ The herestring is deliberate -- do NOT "simplify" it back to `printf ... | grep -qxF`.
    # Under `set -o pipefail`, if `grep -q` exits on a match before `printf` has finished writing,
    # `printf` takes SIGPIPE and the pipeline returns non-zero -- inverting this test and deleting
    # a mod that MODS still lists, on the same Longhorn volume as the world save. `keep` is ~250
    # bytes today so it fits the pipe buffer atomically and this cannot fire, but the failure mode
    # is silent and destructive and the size is not guaranteed. A herestring has no pipeline.
    is_kept() {
      grep -qxF "$1" <<< "$keep"
    }

    # Directory names present under a root that MODS no longer lists.
    doomed_in() {
      local root=$1 d n
      [ -d "$root" ] || return 0
      for d in "$root"/*/; do
        [ -d "$d" ] || continue
        n=$(basename "$d")
        is_kept "$n" || printf '%s\n' "$n"
      done
    }

    # DISTINCT names across both roots -- `sort -u`, deliberately NOT the sum of the two counts.
    # A mod is normally present in the staged copy AND the live install, so summing would double
    # every removal and trip the breaker below at half its intended threshold, on an ordinary
    # two-mod change.
    doomed=$( { doomed_in "$PLUGINS"; doomed_in "$LIVE_PLUGINS"; } | sort -u )
    if [ -z "$doomed" ]; then
      doomed_n=0
    else
      doomed_n=$(printf '%s\n' "$doomed" | wc -l | tr -d '[:space:]')
    fi

    # --- bulk-prune circuit breaker -------------------------------------------------------
    # ⚠️ DO NOT raise this threshold to push a large cleanup through, and do NOT delete it on the
    # grounds that the empty-set guard above already covers bad input. It does not. A MODS block
    # scalar clipped mid-list by a bad edit still parses to a valid, non-empty set, and the prune
    # would then read every mod BELOW the cut as deliberately removed and delete it from both
    # plugin dirs and its marker -- silently, while logging success.
    #
    # Restoring the clipped line does NOT undo that. EpicLoot, Warfare, Armory and
    # OdinsFoodBarrels register prefabs whose placed instances are persisted as ZDOs in
    # TreeFellMeFirst.db. Boot once without the DLL and those ZDOs are orphaned; reinstalling the
    # mod later brings back the item definitions, not the objects players had built or dropped.
    # That is why this is a hard refusal and not a warning.
    #
    # A deliberate removal in this repo is one mod at a time. More than two in a single boot is
    # the signature of a clipped MODS block, not an intention. Failing the initContainer keeps the
    # pod down until a human looks -- recoverable. A wrongly pruned world is not.
    if [ "$doomed_n" -gt 2 ] && [ "${PRUNE_ALLOW_BULK:-}" != "yes" ]; then
      doomed_list=$(printf '%s\n' "$doomed" | tr '\n' ' ')
      echo "[FAIL ] prune would remove $doomed_n mods in a single boot: $doomed_list" >&2
      echo "         Refusing. More than 2 at once usually means the MODS block in" >&2
      echo "         mods-configmap.yaml was truncated, not that this many mods were dropped." >&2
      echo "         Check MODS still lists every mod you expect before doing anything else." >&2
      echo "         If this removal really is intended, add to the fetch-mods container in" >&2
      echo "         deployment.yaml an env var PRUNE_ALLOW_BULK with value \"yes\", apply, let" >&2
      echo "         it boot once, then remove it again." >&2
      exit 1
    fi

    prune_dir() {
      local root=$1 label=$2 d n
      if [ ! -d "$root" ]; then
        echo "[prune] $label: $root absent, nothing to do"
        return 0
      fi
      for d in "$root"/*/; do
        [ -d "$d" ] || continue
        n=$(basename "$d")
        if ! is_kept "$n"; then
          echo "[prune] $label: removing $n (not in MODS)"
          rm -rf "${root:?}/${n:?}"
        fi
      done
    }

    echo "=== pruning mods no longer in MODS ($doomed_n to remove) ==="
    prune_dir "$PLUGINS"      "staged"
    prune_dir "$LIVE_PLUGINS" "live"

    # Orphaned install markers go too, so re-adding a mod later reinstalls it cleanly instead of
    # being skipped by a stale version+sha marker.
    #
    # Markers are deliberately NOT counted by the breaker above: a marker is regenerable metadata,
    # and one left behind with no plugin dir is a cosmetic inconsistency, not data loss. The
    # breaker exits before this loop anyway, so a truncation large enough to trip the breaker
    # never reaches it.
    for m in "$STATE"/*; do
      [ -f "$m" ] || continue
      n=$(basename "$m")
      if ! is_kept "$n"; then
        echo "[prune] marker: removing $n"
        rm -f "${STATE:?}/${n:?}"
      fi
    done

    echo "=== applying per-mod config ==="
    while IFS='|' read -r file section key value; do
      [ -z "${file:-}" ] && continue
      case "$file" in \#*) continue ;; esac
      set_cfg "$file" "$section" "$key" "$value"
    done <<< "${MOD_CONFIG:-}"

    # Match the ownership the game container expects (PUID/PGID 10000).
    chown -R 10000:10000 "$BEPINEX_CONFIG"

    echo "=== done: $installed installed, $skipped already present ==="
    echo "--- BepInEx/plugins staged on the PVC ---"
    ls -1 "$PLUGINS"
