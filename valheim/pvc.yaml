# /valheim-saves -- worlds_local/ (world + Valheim's rolling auto-backups) and adminlist.txt.
# The irreplaceable data. Deleting this PVC destroys the world; see README.md Restore before
# ever doing so.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valheim-data
  namespace: valheim
  labels:
    app: valheim
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
# /valheim -- the SteamCMD game install plus BepInEx and the mod set. Disposable: deleting
# this PVC forces a clean reinstall of the game AND the mods on next boot (the initContainer
# markers live here too) and does not affect the world. It is also the blunt way to force a
# game update; the polite way is UPDATE_ON_START in configmap.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valheim-server
  namespace: valheim
  labels:
    app: valheim
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
