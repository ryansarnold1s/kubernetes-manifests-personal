apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim
  namespace: valheim
  labels:
    app: valheim
spec:
  replicas: 1
  strategy:
    # Recreate: RollingUpdate deadlocks on the ReadWriteOnce Longhorn volume (new pod can't mount while old pod holds it).
    type: Recreate
  selector:
    matchLabels:
      app: valheim
  template:
    metadata:
      labels:
        app: valheim
    spec:
      # Valheim needs ~2 minutes to flush the world on SIGTERM; a lower value corrupts the world on every restart.
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 10000
      initContainers:
      # Fetches the pinned, checksum-verified server-side mod set onto the valheim-data PVC
      # BEFORE the game container starts, so the image's bootstrap rsync
      # (/config/bepinex/plugins/ -> BepInEx/plugins/) picks them up on the same boot. That
      # ordering is the whole point -- the rsync runs once at bootstrap, so a DLL delivered any
      # later would sit inert until the next restart.
      #
      # Idempotent: markers in /config/bepinex/.mod-state are keyed on version+sha256, so a
      # normal restart re-downloads nothing and this adds ~1s. Only a first install or a version
      # bump in mods-configmap.yaml pulls from the network. That matters -- Warfare alone is
      # 182MB, and the nightly UPDATE_CRON restart would otherwise refetch the whole set daily.
      #
      # Reuses the game image deliberately: it is already pulled on the node
      # (imagePullPolicy: IfNotPresent) and already ships curl, unzip and sha256sum, so this
      # costs no extra pull and adds no new supply-chain surface.
      #
      # A checksum mismatch fails the init container and the pod will not start. That is
      # intentional for executable code running inside the server. It only gates a first
      # install or a version change, so a Thunderstore outage cannot take down an
      # already-provisioned server.
      - name: fetch-mods
        image: lloesche/valheim-server:sha-732221f4d5b5
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "/scripts/install-mods.sh"]
        env:
        # Explicit key, not envFrom: the ConfigMap also holds install-mods.sh, and "install-mods.sh"
        # is not a valid environment variable name -- envFrom would skip it and emit an
        # InvalidEnvironmentVariableNames event on every pod start.
        - name: MODS
          valueFrom:
            configMapKeyRef:
              name: valheim-mods
              key: MODS
        volumeMounts:
        - name: config
          mountPath: /config
        - name: mod-scripts
          mountPath: /scripts
          readOnly: true
        - name: mod-tmp
          mountPath: /tmp/mods
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            memory: "1Gi"
      containers:
      - name: valheim
        image: lloesche/valheim-server:sha-732221f4d5b5
        imagePullPolicy: IfNotPresent
        ports:
        - name: game
          containerPort: 2456
          protocol: UDP
        - name: query
          containerPort: 2457
          protocol: UDP
        envFrom:
        - configMapRef:
            name: valheim-config
        env:
        - name: SERVER_PASS
          valueFrom:
            secretKeyRef:
              name: valheim-secrets
              key: server-password
        volumeMounts:
        - name: config
          mountPath: /config
        - name: server
          mountPath: /opt/valheim
        # Deliberately no livenessProbe: it would SIGKILL the server mid-world-save and corrupt the world;
        # supervisord restarts the game process internally, and the Deployment restarts the container if it exits.
        #
        # The pattern MUST stay bracketed as '[v]alheim_server'. `pgrep -f` matches full command
        # lines, so a bare `pgrep -f valheim_server` matches the probe's own `sh -c` process and
        # returns 0 unconditionally — a probe that can never fail. (The `> /dev/null` is what keeps
        # that shell alive: without a redirect bash exec-replaces itself and there is nothing to
        # self-match, which is why the bare form passes a manual smoke test and still never fails.)
        # '[v]alheim_server' matches the real process but not the literal shell argv. Verified in
        # the live container against a process name that does not exist: bare form -> 0, bracketed
        # form -> 1. Do not "simplify" the brackets away.
        startupProbe:
          exec:
            command: ["sh", "-c", "pgrep -f '[v]alheim_server' > /dev/null"]
          periodSeconds: 10
          # 120 x 10s = 20 min. A cold SteamCMD install on a fresh valheim-server PVC has to pull
          # ~2-3GB and lay down BepInEx inside this window or the container is killed and crashloops.
          failureThreshold: 120
        readinessProbe:
          exec:
            command: ["sh", "-c", "pgrep -f '[v]alheim_server' > /dev/null"]
          periodSeconds: 30
          failureThreshold: 3
        # No CPU limit: CFS throttling shows up in-game as rubber-banding, so CPU is deliberately left unbounded.
        resources:
          requests:
            cpu: "2"
            memory: "5Gi"
          limits:
            memory: "8Gi"
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: valheim-data
      - name: server
        persistentVolumeClaim:
          claimName: valheim-server
      - name: mod-scripts
        configMap:
          name: valheim-mods
          defaultMode: 0755
          items:
          - key: install-mods.sh
            path: install-mods.sh
      # Downloads land here, not on the world PVC, so a failed or partial fetch never litters
      # valheim-data. Peak usage is Warfare: a 182MB zip plus its 183MB extraction.
      - name: mod-tmp
        emptyDir:
          sizeLimit: 1Gi
