# NOTE: this file deploys into `longhorn-system`, NOT `mealie`.
#
# This job does nothing until the Longhorn Volume backing mealie-data carries
# the label recurring-job-group.longhorn.io/mealie=enabled — a new or recreated
# PVC's volume starts unlabeled. The label goes on the VOLUME, not the PVC. If
# snapshots aren't appearing, check that before anything else. See
# mealie/README.md (Backups) for the labeling and verification commands.
#
# 03:00 local. Offset from wger-daily-snapshot (04:00 UTC) and valheim-daily-snapshot
# (11:00 UTC) so none of the three contend for Longhorn I/O. NOT offset from any finance
# database backup — no CNPG ScheduledBackup exists on this cluster (verified 2026-08-12;
# see mealie/README.md, Backups). An earlier version of this comment justified the
# schedule against a `finance-db-daily-backup` object that turned out never to have been
# applied. The schedule itself (0 10 * * *) is unaffected and does not need to change.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: mealie-daily-snapshot
  namespace: longhorn-system
spec:
  cron: "0 10 * * *"
  task: snapshot
  groups:
  - mealie
  retain: 7
  concurrency: 1
