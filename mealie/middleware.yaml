# A copy of traefik/default-headers, owned by this namespace so its CSP can be
# relaxed for Mealie without affecting every other app that uses the shared one.
# wger does the same thing with wger-headers.
#
# Any deviation from the shared copy MUST be justified by a console violation
# quoted in a comment beside it — see README.md (CSP).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mealie-headers
  namespace: mealie
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    customFrameOptionsValue: SAMEORIGIN
    customRequestHeaders:
      # Mealie builds absolute links from this alongside BASE_URL. Without it
      # Mealie sees plain HTTP and emits http:// links behind an HTTPS ingress.
      X-Forwarded-Proto: https
    forceSTSHeader: true
    referrerPolicy: no-referrer
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 15552000
    # manifest-src is the one deviation from traefik/default-headers, added here.
    # Observed live in a real browser (Playwright/Chromium) console on both
    # https://mealie.arnoldtech.io/ and /admin/setup, verbatim: "Loading a manifest
    # from 'https://mealie.arnoldtech.io/manifest.webmanifest' violates the
    # following Content Security Policy directive: "default-src 'none'". Note that
    # 'manifest-src' was not explicitly set, so 'default-src' is used as a
    # fallback. The action has been blocked." Mealie's app shell references
    # <link rel="manifest" href="/manifest.webmanifest"> (it is a PWA). This is the
    # minimal directive that clears exactly that violation — nothing else was
    # added speculatively (see README.md CSP section for what remains unverified).
    contentSecurityPolicy: >-
      default-src 'none';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https:;
      style-src 'self' 'unsafe-inline' https:;
      img-src 'self' data: https:;
      font-src 'self' https: data:;
      connect-src 'self' https:;
      frame-src 'self' https:;
      media-src 'self' https:;
      object-src 'none';
      frame-ancestors 'self';
      base-uri 'self';
      form-action 'self';
      manifest-src 'self';
